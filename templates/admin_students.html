<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Управление атлетами</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/mono.css') }}?v=1.0.1">
  <style>
    body{margin:0;background:#f4f4f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:14px;margin-bottom:12px}.student{display:grid;gap:9px;border-top:1px solid #eee;padding:14px 0}.student:first-child{border-top:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}label{font-size:12px;color:#666}input,select{width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{border:1px solid #111;border-radius:10px;padding:10px 14px;background:#111;color:#fff;font-weight:700}.muted{color:#666;font-size:13px}.missing{color:#a15c00;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.grid label:first-child{grid-column:1/-1}}
  </style>
</head>
<body class="mono-theme"><div class="wrap">
  <div class="card"><div class="muted">Клуб</div><h2>{{ club_name }}</h2><p>Управление атлетами клуба. Пользовательские и системные настройки недоступны.</p><a class="mono-action" href="/admin?club_id={{ club_id }}">← Назад в панель</a></div>
  <div class="card"><label>Поиск<input id="search" placeholder="Имя атлета"></label><label style="display:block;margin-top:10px"><input id="missing" type="checkbox" style="width:auto"> Только без даты рождения</label></div>
  <div id="list">
  {% for s in students %}
    <form class="student card" data-name="{{ s.name|lower }}" data-missing="{{ '1' if not s.birthday else '0' }}" data-id="{{ s.id }}">
      <strong>{{ s.name }}</strong><span class="muted">ID {{ s.id }} · баланс: {{ s.balance_lessons }} · {{ s.discipline or 'без дисциплины' }}</span>
      <div class="grid">
        <label>ДР {% if not s.birthday %}<span class="missing">не указана</span>{% endif %}<input name="birthday" type="date" value="{{ s.birthday.isoformat() if s.birthday else '' }}"></label>
        <label>Баланс занятий<input name="balance_lessons" type="number" min="0" max="999" value="{{ s.balance_lessons or 0 }}"></label>
        <label>До даты<input name="expire_date" type="date" value="{{ s.expire_date.strftime('%Y-%m-%d') if s.expire_date else '' }}"></label>
        <label>Бесплатных заморозок<input name="can_freeze" type="number" min="0" max="99" value="{{ s.can_freeze or 0 }}"></label>
        <label>Дисциплина<input name="discipline" value="{{ s.discipline or '' }}"></label>
        <label>Статус<select name="is_frozen"><option value="0" {% if not s.is_frozen %}selected{% endif %}>Активен</option><option value="1" {% if s.is_frozen %}selected{% endif %}>Заморожен</option></select></label>
      </div><button type="submit">Сохранить</button><span class="muted msg"></span>
    </form>
  {% else %}<p>Атлетов нет.</p>{% endfor %}
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const initData=tg?.initData||'';const clubId={{ club_id }};
function filter(){const q=document.getElementById('search').value.toLowerCase(),m=document.getElementById('missing').checked;document.querySelectorAll('.student').forEach(x=>x.style.display=(!q||x.dataset.name.includes(q))&&(!m||x.dataset.missing==='1')?'grid':'none')}
document.getElementById('search').addEventListener('input',filter);document.getElementById('missing').addEventListener('change',filter);
document.querySelectorAll('.student').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(form);const payload={init_data:initData,club_id:clubId,birthday:f.get('birthday'),balance_lessons:Number(f.get('balance_lessons')),expire_date:f.get('expire_date'),can_freeze:Number(f.get('can_freeze')),is_frozen:Number(f.get('is_frozen')),discipline:f.get('discipline')};const r=await fetch('/admin/students/'+form.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const msg=form.querySelector('.msg');if(r.ok){msg.textContent='Сохранено'}else{const d=await r.json();msg.textContent='Ошибка: '+(d.detail||'не удалось сохранить')}}));
</script></body></html>
