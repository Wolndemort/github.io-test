<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR-сканер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background:#1c1c1c; color:#fff; text-align:center; font-family:sans-serif; margin:0; padding:20px; }
    #reader { width:100%; max-width:400px; margin:20px auto; border-radius:15px; overflow:hidden; background:#000; }
    #status { min-height:24px; }
    .ok { color:#66e39a; } .error { color:#ff7777; }
    button { padding:12px 20px; border:0; border-radius:10px; font-size:16px; }
  </style>
</head>
<body>
  <h3>СКАНИРОВАНИЕ ПРОПУСКА</h3>
  <div id="reader"></div>
  <p id="status">Наведите камеру на QR-код</p>
  <button id="retry" type="button" style="display:none;margin:8px 0">Повторить запуск камеры</button>
  <button id="stop" type="button">Завершить сканирование</button>
  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready(); tg?.expand();
    const queryInitData = new URLSearchParams(location.search).get('init_data') || '';
    let initData = queryInitData || tg?.initData || '';
    const status = document.getElementById('status');
    let scanner = new Html5Qrcode('reader');
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    let busy = false, lastCode = '', lastAt = 0, stopped = false, cameraStarting = false;

    function showCameraError(message) {
      status.className = 'error'; status.textContent = message;
      document.getElementById('retry').style.display = 'inline-block';
    }

    function timeout(ms) {
      return new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms));
    }

    async function waitForInitData() {
      for (let attempt = 0; attempt < 100; attempt++) {
        tg?.ready();
        initData = queryInitData || tg?.initData || '';
        if (initData) return true;
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      return false;
    }

    async function startCamera() {
      if (stopped || cameraStarting) return;
      cameraStarting = true; document.getElementById('retry').style.display = 'none';
      status.className = ''; status.textContent = 'Запрашиваем доступ к камере…';
      try {
        try {
          await Promise.race([scanner.start({ facingMode: 'environment' }, config, onScanSuccess), timeout(10000)]);
        } catch (primaryError) {
          try { await scanner.stop(); } catch (_) {}
          const cameras = await Promise.race([Html5Qrcode.getCameras(), timeout(8000)]);
          if (!cameras?.length) throw primaryError;
          const rear = cameras.find(camera => /back|rear|environment|задн/i.test(camera.label || '')) || cameras[0];
          await Promise.race([scanner.start(rear.id, config, onScanSuccess), timeout(10000)]);
        }
        status.textContent = 'Наведите камеру на QR-код';
      } catch (error) {
        try { await scanner.stop(); } catch (_) {}
        scanner = new Html5Qrcode('reader');
        const message = error?.message === 'timeout'
          ? 'Камера не ответила. Разрешите камеру для Telegram в настройках телефона и нажмите «Повторить».'
          : 'Не удалось открыть камеру: ' + (error?.message || error);
        showCameraError(message);
      } finally { cameraStarting = false; }
    }

    async function onScanSuccess(decodedText) {
      const now = Date.now();
      if (busy || (decodedText === lastCode && now - lastAt < 5000)) return;
      busy = true; lastCode = decodedText; lastAt = now;
      if (!(await waitForInitData())) {
        busy = false;
        status.className = 'error';
        status.textContent = 'Telegram не передал данные авторизации. Закройте сканер и откройте его кнопкой из Telegram ещё раз.';
        return;
      }
      status.className = 'ok'; status.textContent = 'Пропуск принят. Ожидаем следующий QR…';
      fetch('/webapp/scanner/scan', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ init_data: initData, club_id: new URLSearchParams(location.search).get('club_id'), qr_data: decodedText })
      }).then(async r => { const data = await r.json(); if (!r.ok) throw new Error(data.detail || 'Ошибка прохода');
        status.textContent = data.success ? `✅ Проход: ${data.student_name}` : `❌ ${data.message}`;
      }).catch(err => { status.className = 'error'; status.textContent = '❌ ' + err.message; })
        .finally(() => setTimeout(() => { busy = false; status.className = ''; status.textContent = 'Наведите камеру на следующий QR-код'; }, 1800));
    }

    document.getElementById('stop').onclick = async () => {
      stopped = true;
      try { await scanner.stop(); } catch (_) {}
      tg?.close();
    };
    document.getElementById('retry').onclick = () => startCamera();
    startCamera();
  </script>
</body>
</html>
