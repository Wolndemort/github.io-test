<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Видеонаблюдение</title>
    <style>
        /* Общие стили под стать Telegram WebApp */
        body {
            margin: 0;
            padding: 16px;
            background-color: #1c1c1e; /* Глубокий темный фон */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Шапка страницы */
        .header {
            width: 100%;
            max-width: 500px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #f2f2f7;
        }

        .camera-switcher {
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .camera-btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 8px;
            background: #2c2c2e;
            color: #ffffff;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .camera-btn.active {
            background: #0a84ff;
        }

        .camera-btn:active {
            transform: scale(0.98);
        }

        .badge {
            background-color: #34c759; /* Зеленый индикатор LIVE */
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite;
        }

        /* Контейнер для плеера с закругленными углами */
        .video-container {
            width: 100%;
            max-width: 500px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            background-color: #000000;
            position: relative;
            aspect-ratio: 16 / 9; /* Автоматически держит пропорции экрана камеры */
        }

        /* Сам тег img, куда FastAPI стримит MJPEG */
        .video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .camera-status {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.82);
            color: #f2f2f7;
            text-align: center;
            transition: opacity 0.2s ease;
        }

        .camera-status.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #34c759;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .camera-status.error .spinner {
            display: none;
        }

        .retry-button {
            display: none;
            border: 0;
            border-radius: 8px;
            padding: 9px 14px;
            background: #0a84ff;
            color: #ffffff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .camera-status.error .retry-button {
            display: inline-block;
        }

        /* Анимация пульсации для плашки LIVE */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Синтаксис {{ club_id }} автоматически подставит ID зала из FastAPI -->
        <h3>📹 Камера (Клуб #{{ club_id }})</h3>
        <span class="badge">Eфир</span>
    </div>

    <div class="camera-switcher" role="tablist" aria-label="Выбор камеры">
        <button class="camera-btn active" type="button" data-camera="camera1">Камера 1</button>
        <button class="camera-btn" type="button" data-camera="camera2">Камера 2</button>
        <button class="camera-btn" type="button" data-camera="camera3">Камера 3</button>
        <button class="camera-btn" type="button" data-camera="camera4">Камера 4</button>
    </div>

    <div class="video-container">
        <div id="camera-status" class="camera-status" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <span id="camera-status-text">Подключение к камере…</span>
            <button id="retry-button" class="retry-button" type="button">Повторить</button>
        </div>
        <img
            id="camera-stream"
            class="video-stream"
            src="/webapp/live_cam/stream?club_id={{ club_id }}"
            alt="Прямая трансляция с камеры"
        />
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const cameraStream = document.getElementById('camera-stream');
        const cameraStatus = document.getElementById('camera-status');
        const cameraStatusText = document.getElementById('camera-status-text');
        const retryButton = document.getElementById('retry-button');
        const cameraButtons = Array.from(document.querySelectorAll('.camera-btn'));
        const baseStreamUrl = '/webapp/live_cam/stream?club_id={{ club_id }}';
        let currentCamera = 'camera1';
        let connectionTimeout;
        let frameWatcher;

        function showConnecting() {
            cameraStatus.classList.remove('hidden', 'error');
            cameraStatusText.textContent = 'Подключение к камере…';
            clearTimeout(connectionTimeout);
            clearInterval(frameWatcher);

            // У MJPEG событие load ведет себя по-разному в разных WebView.
            // Поэтому дополнительно проверяем, появился ли декодированный кадр.
            frameWatcher = setInterval(() => {
                if (cameraStream.naturalWidth > 0) {
                    clearInterval(frameWatcher);
                    clearTimeout(connectionTimeout);
                    cameraStatus.classList.add('hidden');
                }
            }, 250);

            connectionTimeout = setTimeout(() => {
                clearInterval(frameWatcher);
                showError('Камера не ответила за 15 секунд');
            }, 15000);
        }

        function showError(message) {
            clearTimeout(connectionTimeout);
            clearInterval(frameWatcher);
            cameraStatus.classList.remove('hidden');
            cameraStatus.classList.add('error');
            cameraStatusText.textContent = message;
        }

        function setActiveCamera(cameraSrc) {
            currentCamera = cameraSrc;
            cameraButtons.forEach((button) => {
                button.classList.toggle('active', button.dataset.camera === cameraSrc);
            });

            const separator = baseStreamUrl.includes('?') ? '&' : '?';
            cameraStream.src = `${baseStreamUrl}${separator}camera_src=${encodeURIComponent(cameraSrc)}&_=${Date.now()}`;
            showConnecting();
        }

        cameraStream.addEventListener('load', () => {
            clearTimeout(connectionTimeout);
            clearInterval(frameWatcher);
            cameraStatus.classList.add('hidden');
        });

        cameraStream.addEventListener('error', () => {
            showError('Не удалось получить видеопоток');
        });

        retryButton.addEventListener('click', () => {
            setActiveCamera(currentCamera);
        });

        cameraButtons.forEach((button) => {
            button.addEventListener('click', () => {
                setActiveCamera(button.dataset.camera);
            });
        });

        showConnecting();
        setActiveCamera('camera1');

        // Страница также остается удобной для проверки в обычном браузере.
        if (window.Telegram && window.Telegram.WebApp) {
            const webapp = window.Telegram.WebApp;
            webapp.ready();
            webapp.expand();
        }
    </script>
</body>
</html>
