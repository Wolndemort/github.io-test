<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Видеонаблюдение</title>
    <style>
        /* Общие стили под стать Telegram WebApp */
        body {
            margin: 0;
            padding: 16px;
            background-color: #1c1c1e; /* Глубокий темный фон */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Шапка страницы */
        .header {
            width: 100%;
            max-width: 500px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #f2f2f7;
        }

        .badge {
            background-color: #34c759; /* Зеленый индикатор LIVE */
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite;
        }

        /* Контейнер для плеера с закругленными углами */
        .video-container {
            width: 100%;
            max-width: 500px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            background-color: #000000;
            position: relative;
            aspect-ratio: 16 / 9; /* Автоматически держит пропорции экрана камеры */
        }

        /* Сам тег img, куда FastAPI стримит MJPEG */
        .video-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Анимация пульсации для плашки LIVE */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Синтаксис {{ club_id }} автоматически подставит ID зала из FastAPI -->
        <h3>📹 Камера (Клуб #{{ club_id }})</h3>
        <span class="badge">Eфир</span>
    </div>

    <div class="video-container">
        <!-- Запрашиваем поток с нашего нового эндпоинта, передавая club_id -->
        <img class="video-stream" src="https://camera.aemaykop-skud.netcraze.pro{{ club_id }}" alt="Подключение к камере..." />
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализируем WebApp Telegram, чтобы он понимал, что страница загрузилась
        const webapp = window.Telegram.WebApp;
        webapp.ready();
        webapp.expand(); // Автоматически раскрываем WebApp на весь экран телефона
    </script>
</body>
</html>
