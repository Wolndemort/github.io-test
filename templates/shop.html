<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:sans-serif;background:#f4f4f4;padding:14px}.item,.cart{background:#fff;border-radius:14px;padding:14px;margin:9px 0}.item img{width:100%;height:180px;object-fit:cover;border-radius:10px}.row{display:flex;justify-content:space-between}button{padding:9px 12px;border:0;border-radius:8px;background:#111;color:#fff;margin:2px}#checkout{width:100%;font-size:16px}</style><h2>Магазин {{club.name}}</h2><div id=items></div><div class=cart><h3>Корзина</h3><div id=cart>Пусто</div><b id=total>Итого: 0 ₽</b><button id=checkout disabled>Оплатить корзину</button></div><script>const tg=Telegram.WebApp;tg.ready();const cid={{club_id}},products={{products|tojson}},itemsEl=document.getElementById('items'),cartEl=document.getElementById('cart'),totalEl=document.getElementById('total'),checkoutEl=document.getElementById('checkout'),cart=new Map();JSON.parse(localStorage.getItem('speedy_cart')||'[]').forEach((x,i)=>cart.set(x.product_id||(`${x.item_type}-${x.student_id}-${i}`),x));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function pay(items){let r=await fetch('/webapp/cart/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:cid,items})}),d=await r.json();if(!r.ok)return alert(d.detail||'Ошибка');localStorage.removeItem('speedy_cart');location.href=d.payment_url}function draw(){let sum=0;cartEl.innerHTML=[...cart.values()].map((x,k)=>{sum+=x.price*x.quantity;return `${esc(x.name||x.item_type)} × ${x.quantity} <button data-k="${k}">−</button>`}).join('<br>')||'Пусто';cartEl.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let key=[...cart.keys()][Number(b.dataset.k)],x=cart.get(key);if(--x.quantity<1)cart.delete(key);draw()});totalEl.textContent='Итого: '+(sum/100).toFixed(2)+' ₽';checkoutEl.disabled=!sum}function render(){itemsEl.innerHTML=products.map(p=>`<div class=item>${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<div style="height:180px;display:grid;place-items:center;background:#eee;border-radius:10px;font-size:42px">🖼️</div>'}<div class=row><b>${esc(p.name)}</b><span>${(p.price_kopecks/100).toFixed(2)} ₽</span></div><small>${esc(p.category)} · осталось ${p.stock}</small><br><button data-id="${p.id}">В корзину</button><button data-buy="${p.id}">Купить сейчас</button></div>`).join('')||'<p>Товаров пока нет.</p>';itemsEl.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===Number(b.dataset.id)),x=cart.get(p.id)||{item_type:'product',product_id:p.id,name:p.name,price:p.price_kopecks,max:p.stock,quantity:0};if(x.quantity<x.max)x.quantity++;cart.set(p.id,x);draw()});itemsEl.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===Number(b.dataset.buy));pay([{item_type:'product',product_id:p.id,quantity:1}])})}checkoutEl.onclick=()=>pay([...cart.values()]);render();draw()</script></html>
<style>html,body{background:#090909!important;color:#f7f7f7!important}h2,h3,b{color:#fff!important}.item,.cart{background:#151515!important;color:#f7f7f7!important;border:1px solid #2d2d2d;box-shadow:0 16px 42px rgba(0,0,0,.28)}small{color:#aaa}button{background:#fff!important;color:#090909!important;font-weight:700}</style>
<script>const clearCart=document.createElement('button');clearCart.textContent='Очистить корзину';clearCart.style.marginTop='8px';clearCart.onclick=()=>{cart.clear();localStorage.removeItem('speedy_cart');draw()};document.querySelector('.cart').appendChild(clearCart);const support=document.createElement('a');support.textContent='Поддержка клуба';support.href='https://t.me/{{ club.club_settings.get("ui", {}).get("support_link", "")|replace("@", "") }}';support.style='display:block;color:#aaa;text-align:center;margin:14px';document.body.appendChild(support);</script>
<script>const baseDraw=draw;function decorateCart(){cartEl.querySelectorAll('[data-k]').forEach(b=>{if(b.nextElementSibling?.dataset?.remove)return;const r=document.createElement('button');r.textContent='Удалить';r.dataset.remove='1';r.onclick=()=>{cart.delete([...cart.keys()][Number(b.dataset.k)]);localStorage.setItem('speedy_cart',JSON.stringify([...cart.values()]));draw()};b.after(r)})}draw=()=>{baseDraw();decorateCart()};decorateCart();</script>
