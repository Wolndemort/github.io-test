<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:sans-serif;background:#090909;color:#f7f7f7;padding:14px 14px 92px}
.bar{position:sticky;top:0;background:#090909;padding:8px 0 12px;z-index:2}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:8px 12px;border-radius:999px;border:1px solid #333;background:#151515;color:#fff;cursor:pointer}
.chip.active{background:#fff;color:#111}
.item{background:#151515;border:1px solid #2d2d2d;border-radius:14px;padding:14px;margin:9px 0}
.item img{width:100%;height:auto;object-fit:contain;background:#111;border-radius:12px;padding:8px;display:block;box-sizing:border-box}
.thumb{width:100%;aspect-ratio:1.3 / 1;border-radius:12px;background:linear-gradient(135deg,#2b2b2b,#1b1b1b);display:grid;place-items:center;font-size:54px;color:#aaa;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;background:#111;display:block;padding:8px;box-sizing:border-box}
.row2{display:flex;justify-content:space-between;gap:10px}
button,.link{display:inline-block;padding:9px 12px;border:0;border-radius:8px;background:#fff;color:#090909;font-weight:700;margin:2px;text-decoration:none;cursor:pointer}
#cart-link{position:fixed;left:14px;right:14px;bottom:14px;z-index:4;display:block;text-align:center;margin:0;padding:12px 14px;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#back{background:#1b1b1b;color:#fff;border:1px solid #444}
small{color:#aaa}
.pay-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid #2d2d2d;background:#111;color:#fff;font-size:12px;line-height:1}
.pay-badge.sbp{background:#12381f;border-color:#1f5d31;color:#9af0b4}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.row2 span{white-space:nowrap;flex:0 0 auto}
.product-details summary{cursor:pointer;color:#ddd;margin-top:8px}
.product-details .details-box{margin-top:6px;padding:10px;border-radius:10px;background:#111;border:1px solid #2d2d2d;color:#ddd;font-size:13px;line-height:1.45}
</style>
<a id="back" class="link" href="/webapp/client-cabinet?club_id={{ club_id }}">← В кабинет</a>
<h2>Магазин {{ club.name }}</h2>
<div class="bar">
  <div class="row" id="filters">
    <button class="chip active" data-cat="">Все</button>
    {% for category in categories %}
      <button class="chip" data-cat="{{ category }}">{{ category }}</button>
    {% endfor %}
  </div>
</div>
<div id="payment-info" style="margin:8px 0 0;color:#aaa">Оплата по реквизитам доступна: <b>{{ payment_info }}</b></div>
<div id="message" style="color:#aaa;min-height:20px"></div>
<div id="items"></div>
<a id="cart-link" class="link" href="/webapp/cart?club_id={{ club_id }}">🛒 Открыть корзину</a>
<script>
const tg=Telegram.WebApp;tg.ready();
const products={{ products|tojson }};
const sbpEnabled={{ sbp_enabled|tojson }};
let currentCategory="";
const itemsEl=document.getElementById('items');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalizeCategory=x=>String(x??'other').trim().toLowerCase().replace(/\s+/g,' ').replace(/ё/g,'е');
const getCategoryLabel=x=>String(x??'other').trim()||'other';
const thumbHtml=p=>p.image_url?`<div class="thumb"><img src="${esc(p.image_url)}" alt="${esc(p.name)}"></div>`:`<div class="thumb">${esc((p.name||'🛍️').trim().charAt(0).toUpperCase()||'🛍️')}</div>`;
const read=()=>JSON.parse(localStorage.getItem('speedy_cart')||'[]'),save=x=>localStorage.setItem('speedy_cart',JSON.stringify(x));
function updateCartLink(){const n=read().reduce((s,x)=>s+Number(x.quantity||1),0);document.getElementById('cart-link').textContent=`🛒 Открыть корзину (${n})`}
function added(){document.getElementById('message').textContent='Добавлено в корзину — можно продолжать покупки.'}
function checkoutProduct(productId, paymentMethod){
  const p=products.find(x=>x.id===Number(productId));
  if(!p) return;
  fetch('/webapp/cart/checkout',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({init_data:tg.initData,club_id:{{club_id}},items:[{item_type:'product',product_id:p.id,quantity:1}],payment_method:paymentMethod})
  }).then(async r=>{
    const d=await r.json();
    if(!r.ok) return alert(d.detail||'Ошибка');
    if(d.payment_url){
      localStorage.removeItem('speedy_cart');
      const tg = window.Telegram?.WebApp;
      if (tg?.openLink) tg.openLink(d.payment_url, {try_instant_view: false});
      else location.href = d.payment_url;
    } else if(d.charged){
      localStorage.removeItem('speedy_cart');
      alert(d.message||'Оплата прошла по сохраненной карте.');
    } else if(d.review_required){
      alert(d.message||'Заявка отправлена администратору.');
    } else {
      alert(d.message||'Готово');
    }
  });
}
function render(){
  const list=products.filter(p=>!currentCategory||normalizeCategory(p.category)===currentCategory);
  itemsEl.innerHTML=list.map(p=>`<div class="item">${thumbHtml(p)}<div class="row2"><b>${esc(p.name)}</b><span>${(p.price_kopecks/100).toFixed(2)} ₽</span></div><small>${esc(p.category)} · ${p.stock > 0 ? `осталось ${p.stock}` : 'закончился'}</small>${p.details?`<details class="product-details"><summary>Состав / описание</summary><div class="details-box">${esc(p.details)}</div></details>`:''}<div class="actions" style="margin-top:8px"><span class="pay-badge ${sbpEnabled?'sbp':''}">СБП${sbpEnabled?' доступна':' недоступна'}</span><button data-id="${p.id}" ${p.stock > 0 ? '' : 'disabled'}>В корзину</button><button data-buy="${p.id}" ${p.stock > 0 ? '' : 'disabled'}>Купить сейчас</button><button data-sbp="${p.id}" ${sbpEnabled && p.stock > 0 ? '' : 'disabled'}>СБП</button><button data-manual="${p.id}" ${p.stock > 0 ? '' : 'disabled'}>По реквизитам</button></div></div>`).join('')||'<p>Товаров пока нет.</p>';
  itemsEl.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===Number(b.dataset.id)); if(!p||p.stock<=0){document.getElementById('message').textContent='Товар закончился. Выберите другой.'; return;} const items=read(),x=items.find(x=>x.item_type==='product'&&x.product_id===p.id);if(x){if(x.quantity<p.stock)x.quantity++}else items.push({item_type:'product',product_id:p.id,name:p.name,price:p.price_kopecks,max:p.stock,quantity:1});save(items);updateCartLink();added()});
  itemsEl.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===Number(b.dataset.buy)); if(!p||p.stock<=0){document.getElementById('message').textContent='Товар закончился. Выберите другой.'; return;} checkoutProduct(Number(b.dataset.buy),'bank_card')});
  itemsEl.querySelectorAll('[data-sbp]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===Number(b.dataset.sbp)); if(!p||p.stock<=0){document.getElementById('message').textContent='Товар закончился. Выберите другой.'; return;} checkoutProduct(Number(b.dataset.sbp),'sbp')});
  itemsEl.querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===Number(b.dataset.manual)); if(!p||p.stock<=0){document.getElementById('message').textContent='Товар закончился. Выберите другой.'; return;} checkoutProduct(Number(b.dataset.manual),'requisites')});
}
document.getElementById('filters').onclick=e=>{const btn=e.target.closest('[data-cat]');if(!btn)return;currentCategory=normalizeCategory(btn.dataset.cat);document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===btn));render()};
render();updateCartLink();
</script>
<script src="/static/js/scroll_top.js"></script>
</html>
