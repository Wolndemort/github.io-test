<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:sans-serif;background:#f4f4f4;padding:14px}.item,.cart{background:#fff;border-radius:14px;padding:14px;margin:9px 0}.item img{width:100%;height:180px;object-fit:cover;border-radius:10px}.row{display:flex;justify-content:space-between}button{padding:9px 12px;border:0;border-radius:8px;background:#111;color:#fff}#checkout{width:100%;font-size:16px}</style><h2>Магазин {{club.name}}</h2><div id=items></div><div class=cart><h3>Корзина</h3><div id=cart>Пусто</div><b id=total>Итого: 0 ₽</b><button id=checkout onclick=buy() disabled>Оплатить</button></div><script>const tg=Telegram.WebApp;tg.ready();const cid={{club_id}},products={{products|tojson}},cart=new Map();JSON.parse(localStorage.getItem('speedy_cart')||'[]').forEach((x,i)=>cart.set(x.product_id||(`${x.item_type}-${x.student_id}-${i}`),x));function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderProducts(){items.innerHTML=products.map(p=>`<div class=item>${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<div style="height:180px;display:grid;place-items:center;background:#eee;border-radius:10px;font-size:42px">🖼️</div>'}<div class=row><b>${esc(p.name)}</b><span>${(p.price_kopecks/100).toFixed(2)} ₽</span></div><small>${esc(p.category)} · осталось ${p.stock}</small><br><button data-id="${p.id}">В корзину</button></div>`).join('')||'<p>Товаров пока нет.</p>';items.querySelectorAll('button').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===Number(b.dataset.id)),x=cart.get(p.id)||{item_type:'product',product_id:p.id,name:p.name,price:p.price_kopecks,max:p.stock,quantity:0};if(x.quantity<x.max)x.quantity++;cart.set(p.id,x);draw()})}function draw(){let t=0;cartEl.innerHTML=[...cart.values()].map((x,k)=>{t+=x.price*x.quantity;return `${esc(x.name||x.item_type)} × ${x.quantity} <button data-k="${k}">−</button>`}).join('<br>')||'Пусто';cartEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{let z=[...cart.keys()][Number(b.dataset.k)],x=cart.get(z);if(--x.quantity<1)cart.delete(z);draw()});total.textContent='Итого: '+(t/100).toFixed(2)+' ₽';checkout.disabled=!t}async function buy(){localStorage.setItem('speedy_cart',JSON.stringify([...cart.values()]));let r=await fetch('/webapp/cart/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:cid,items:[...cart.values()]})}),d=await r.json();if(!r.ok)return alert(d.detail||'Ошибка');localStorage.removeItem('speedy_cart');location.href=d.payment_url}renderProducts();draw()</script></html>
