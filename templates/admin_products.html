<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{font-family:sans-serif;background:#f4f4f4;padding:14px;color:#111}
  .topbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .navlink{display:block;text-align:center;text-decoration:none;padding:10px 12px;border-radius:12px;border:1px solid #111;background:#111;color:#fff;font-weight:700}
  .navlink.secondary{background:#fff;color:#111;border-color:#bbb}
  .card{background:#fff;border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .filters select{flex:1;min-width:180px}
  .product{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #ececec}
  .thumb{width:72px;height:72px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#ececec,#d9d9d9);display:grid;place-items:center;font-size:28px;font-weight:700;color:#666}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f0f0;font-size:12px;color:#333;white-space:nowrap}.category-delete{padding:4px 7px;font-size:11px;background:#fff0f0;color:#8a2222;border-color:#e0aaaa}
  .pill.ok{background:#e8f7ec;color:#15703b}
  .pill.off{background:#f2f2f2;color:#8a8a8a}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  input,button,select,textarea{padding:10px;margin:3px 0;border-radius:10px;border:1px solid #ccc;font-size:15px}
  button{background:#111;color:#fff}
  #list .card.off{opacity:.72}
  .form-grid{display:grid;gap:8px}
  .product-info{margin-top:8px;color:#555;font-size:13px;line-height:1.45}
  details.product-details summary{cursor:pointer;font-size:13px;color:#444}
  .price-pill{white-space:nowrap;flex:0 0 auto}
  .quickbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
  .quickbar button{margin:0}
  .floating-top{position:fixed;right:16px;bottom:82px;z-index:40;width:48px;height:48px;border-radius:50%;border:0;background:#111;color:#fff;font-size:20px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
  @media(max-width:640px){.product{grid-template-columns:1fr}}
</style>
<div class="topbar">
  <a class="navlink" href="/admin?club_id={{ club_id }}&init_data={{ request.query_params.get('init_data','')|urlencode }}">← В панель</a>
  <a class="navlink secondary" href="#" onclick="window.Telegram?.WebApp?.close(); return false;">Закрыть</a>
</div>
<h2>Товары клуба</h2>
<div class="card">
  <div class="filters">
    <div id="categoryTools" class="meta"></div>
    <select id="categoryFilter"><option value="">Все категории</option></select>
  </div>
</div>
<div class="card quickbar">
  <button id="createBtn" type="button">Создать товар</button>
  <button id="topBtn" type="button">Наверх</button>
</div>
<div class="card" id="productForm">
  <h3 id="caption">Новый товар</h3>
  <div class="form-grid">
    <input id="n" placeholder="Название">
    <input id="c" list="categorySuggestions" placeholder="Категория">
    <datalist id="categorySuggestions"></datalist>
    <textarea id="details" placeholder="Состав / описание товара" style="min-height:90px;resize:vertical"></textarea>
    <input id="p" type="number" min="1" placeholder="Цена ₽">
    <input id="s" type="number" min="0" placeholder="Остаток">
    <input id="i" placeholder="URL картинки">
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
    <label><input id="a" type="checkbox" checked> Активен</label>
    <div class="actions">
    <button id="saveBtn" type="button">Сохранить</button>
      <button id="resetBtn" type="button">Очистить</button>
    </div>
  </div>
</div>
<div id="list"></div>
<button id="scrollTopBtn" class="floating-top" type="button" aria-label="Наверх">↑</button>
<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
const cid={{club_id}},items={{products|tojson}};
let edit=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalizeCategory=x=>String(x??'other').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
const categoryMap=new Map();
items.forEach(x=>{const raw=String(x.category||'other').trim()||'other',key=normalizeCategory(raw);if(!categoryMap.has(key))categoryMap.set(key,raw);});
const categories=[...categoryMap.values()].sort((a,b)=>a.localeCompare(b,'ru'));
const productForm = document.getElementById('productForm');
const categoryFilter = document.getElementById('categoryFilter');
const categorySuggestions = document.getElementById('categorySuggestions');
const categoryTools = document.getElementById('categoryTools');
const list = document.getElementById('list');
const n = document.getElementById('n');
const c = document.getElementById('c');
const details = document.getElementById('details');
const p = document.getElementById('p');
const s = document.getElementById('s');
const i = document.getElementById('i');
const file = document.getElementById('file');
const a = document.getElementById('a');
const caption = document.getElementById('caption');
const saveBtn = document.getElementById('saveBtn');
const resetBtn = document.getElementById('resetBtn');
const createBtn = document.getElementById('createBtn');
const topBtn = document.getElementById('topBtn');
const scrollTopBtn = document.getElementById('scrollTopBtn');
categories.forEach(x=>{
  categoryFilter.insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(x)}</option>`);
  categorySuggestions.insertAdjacentHTML('beforeend',`<option value="${esc(x)}">`);
});

function thumb(x){
  if(x.image_url) return `<div class="thumb"><img src="${esc(x.image_url)}" alt="${esc(x.name)}"></div>`;
  return `<div class="thumb">🖼️</div>`;
}

function scrollTopSmooth(){ window.scrollTo({top:0, behavior:'smooth'}); }

function draw(){
  const filter=normalizeCategory(categoryFilter.value);
  list.innerHTML=items.filter(x=>!filter||normalizeCategory(x.category)===filter).map(x=>`
    <div class="card ${x.is_active?'':'off'}">
      <div class="product">
        ${thumb(x)}
        <div>
          <b>${esc(x.name)}</b>
          <div class="meta">
            <span class="pill">${esc(x.category)}</span>
            <span class="pill price-pill">₽ ${(x.price_kopecks/100).toFixed(2)}</span>
            <span class="pill">Остаток ${x.stock}</span>
            <span class="pill ${x.is_active?'ok':'off'}">${x.is_active?'активен':'выключен'}</span>
          </div>
          ${x.details ? `<details class="product-details"><summary>Состав / описание</summary><div class="product-info">${esc(x.details)}</div></details>` : ''}
          <div class="actions">
            <button data-edit="${x.id}">Изменить</button>
            <button data-del="${x.id}">Удалить</button>
          </div>
        </div>
      </div>
    </div>
  `).join('')||'Товаров нет';
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(Number(b.dataset.edit)));
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(Number(b.dataset.del)));
  categoryTools.innerHTML=categories.map(x=>`<button class="category-delete" type="button" data-category="${esc(x)}">Удалить «${esc(x)}»</button>`).join('');
  categoryTools.querySelectorAll('.category-delete').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.category));
}

async function deleteCategory(category){
  const replacement=prompt('Перенести товары из категории «'+category+'» в категорию:', 'other');
  if(replacement===null)return;
  if(!confirm('Удалить категорию «'+category+'»? Товары будут перенесены в «'+(replacement||'other')+'».'))return;
  const r=await fetch('/webapp/admin-product-categories/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:cid,category,replacement_category:replacement||'other'})});
  const d=await r.json();
  if(!r.ok)return alert(d.detail||'Не удалось удалить категорию');
  location.reload();
}

function editItem(id){
  const x=items.find(y=>y.id===id);
  edit=id;
  n.value=x.name;
  c.value=x.category;
  p.value=x.price_kopecks/100;
  s.value=x.stock;
  i.value=x.image_url||'';
  details.value=x.details||'';
  a.checked=x.is_active;
  caption.textContent='Изменить товар';
  productForm.scrollIntoView({behavior:'smooth', block:'start'});
}

function reset(){
  edit=null;
  n.value=c.value=p.value=s.value=i.value=details.value='';
  file.value='';
  a.checked=true;
  caption.textContent='Новый товар';
}

async function save(){
  let image=i.value||null;
  if(file.files[0]){
    const fd=new FormData();fd.append('image',file.files[0]);
    const u=await fetch('/webapp/admin-products/upload-image?club_id='+cid+'&init_data='+encodeURIComponent(tg?.initData||''),{method:'POST',body:fd}),
          ud=await u.json();
    if(!u.ok) return alert(ud.detail||'Ошибка загрузки');
    image=ud.image_url;
  }
  const body={init_data:tg?.initData||'',club_id:cid,name:n.value,category:c.value||'other',price_kopecks:Math.round(Number(p.value)*100),stock:Number(s.value)||0,is_active:a.checked,image_url:image,details:details.value};
  const r=await fetch(edit?'/webapp/admin-products/'+edit:'/webapp/admin-products',{method:edit?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) return alert((await r.json()).detail||'Ошибка');
  location.reload();
}

async function del(id){
  if(!confirm('Удалить товар?')) return;
  const r=await fetch('/webapp/admin-products/'+id+'?club_id='+cid+'&init_data='+encodeURIComponent(tg?.initData||''),{method:'DELETE'});
  if(r.ok) location.reload(); else alert('Ошибка');
}

saveBtn.onclick=save;
resetBtn.onclick=reset;
createBtn.onclick=()=>{reset(); productForm.scrollIntoView({behavior:'smooth', block:'start'});};
topBtn.onclick=scrollTopSmooth;
scrollTopBtn.onclick=scrollTopSmooth;
categoryFilter.onchange=draw;
draw();
</script></html>
