<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:sans-serif;background:#f4f4f4;padding:14px}.card{background:#fff;border-radius:14px;padding:12px;margin:8px 0}input,button{padding:9px;margin:3px;border-radius:7px;border:1px solid #ccc}button{background:#111;color:#fff}.off{opacity:.5}img{width:90px;height:60px;object-fit:cover;border-radius:8px}</style><h2>Товары клуба</h2><div id=list></div><div class=card><h3 id=caption>Новый товар</h3><input id=n placeholder="Название"><input id=c placeholder="Категория"><input id=p type=number min=1 placeholder="Цена ₽"><input id=s type=number min=0 placeholder="Остаток"><input id=i placeholder="URL картинки"><input id=file type=file accept="image/jpeg,image/png,image/webp"><label><input id=a type=checkbox checked> Активен</label><br><button onclick=save()>Сохранить</button><button onclick=reset()>Очистить</button></div><script>const tg=Telegram.WebApp;tg.ready();const cid={{club_id}},items={{products|tojson}};let edit=null;function draw(){list.innerHTML=items.map(x=>`<div class="card ${x.is_active?'':'off'}">${x.image_url?`<img src="${x.image_url}">`:'🖼️'} <b>${x.name}</b><br>${x.category} · ${(x.price_kopecks/100).toFixed(2)} ₽ · остаток ${x.stock} · ${x.is_active?'активен':'выключен'}<br><button onclick="editItem(${x.id})">Изменить</button><button onclick="del(${x.id})">Удалить</button></div>`).join('')||'Товаров пока нет'}function editItem(id){let x=items.find(y=>y.id===id);edit=id;n.value=x.name;c.value=x.category;p.value=x.price_kopecks/100;s.value=x.stock;i.value=x.image_url||'';a.checked=x.is_active;caption.textContent='Изменить товар'}function reset(){edit=null;n.value=c.value=p.value=s.value=i.value='';file.value='';a.checked=true;caption.textContent='Новый товар'}async function save(){let image=i.value||null;if(file.files[0]){let fd=new FormData();fd.append('image',file.files[0]);let u=await fetch('/webapp/admin-products/upload-image?club_id='+cid+'&init_data='+encodeURIComponent(tg.initData),{method:'POST',body:fd});let ud=await u.json();if(!u.ok)return alert(ud.detail||'Ошибка загрузки');image=ud.image_url}let body={init_data:tg.initData,club_id:cid,name:n.value,category:c.value||'other',price_kopecks:Math.round(Number(p.value)*100),stock:Number(s.value)||0,is_active:a.checked,image_url:image};let r=await fetch(edit?'/webapp/admin-products/'+edit:'/webapp/admin-products',{method:edit?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return alert((await r.json()).detail||'Ошибка');location.reload()}async function del(id){if(!confirm('Удалить товар?'))return;let r=await fetch('/webapp/admin-products/'+id+'?club_id='+cid+'&init_data='+encodeURIComponent(tg.initData),{method:'DELETE'});if(r.ok)location.reload();else alert('Ошибка')}draw()</script></html>
