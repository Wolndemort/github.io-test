<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:sans-serif;background:#f4f4f4;margin:0;padding:14px;color:#111}.card{background:white;border-radius:16px;padding:14px;margin:10px 0}input,select,button{padding:10px;margin:3px;border-radius:8px;border:1px solid #ccc}button{background:#111;color:white}.lesson{border-top:1px solid #ddd;padding:8px 0}</style></head><body>
<h2>Расписание — {{ club.name }}</h2><select id="d">{% for key,x in disciplines.items() %}<option value="{{key}}">{{x.get('name',key)}}</option>{% endfor %}</select><select id="day"><option value="mon">Пн</option><option value="tue">Вт</option><option value="wed">Ср</option><option value="thu">Чт</option><option value="fri">Пт</option><option value="sat">Сб</option><option value="sun">Вс</option></select><div id="list"></div><div class="card"><input id="time" placeholder="18:00"><input id="coach" placeholder="Тренер"><input id="slots" type="number" value="50" min="1"><button onclick="save('add')">Добавить</button></div>
<script>const tg=Telegram.WebApp;tg.ready();tg.expand();const data={{ disciplines|tojson }};let idx=null;function render(){let a=(data[d.value]?.schedule||{})[day.value]||[];list.innerHTML=a.map((x,i)=>`<div class=lesson><b>${x.time}</b> — ${x.coach||''} (${x.max_slots||50}) <button onclick="edit(${i})">Изменить</button><button onclick="removeL(${i})">Удалить</button></div>`).join('')||'<p>Нет занятий</p>'}function edit(i){let x=(data[d.value].schedule[day.value]||[])[i];idx=i;time.value=x.time;coach.value=x.coach;slots.value=x.max_slots;document.querySelector('button[onclick="save(\'add\')"]').textContent='Сохранить'}async function api(action,index=null){let r=await fetch('/webapp/admin-schedule/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:{{club_id}},action,discipline:d.value,day:day.value,index,lesson:{time:time.value,coach:coach.value,max_slots:Number(slots.value)}})});if(!r.ok)throw Error((await r.json()).detail||'Ошибка');location.reload()}function save(){api(idx===null?'add':'update',idx).catch(e=>alert(e.message))}function removeL(i){if(confirm('Удалить занятие?'))api('delete',i).catch(e=>alert(e.message))}d.onchange=day.onchange=()=>{idx=null;render()};render()</script></body></html>
