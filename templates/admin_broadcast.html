<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Персональная рассылка</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f4f4;color:#111;padding:14px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #ddd}h1{font-size:24px;margin:6px 0 14px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:10px;font:inherit}textarea{min-height:110px;resize:vertical}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tools button{background:#111;color:#fff}.tools button.secondary{background:#fff;color:#111}.student{display:flex;align-items:flex-start;gap:10px;border-top:1px solid #eee;padding:11px 0}.student:first-child{border-top:0}.student input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}.student-main{flex:1}.student-name{font-weight:750}.muted{color:#777;font-size:13px}.badge{display:inline-block;margin-left:5px;padding:2px 7px;border-radius:99px;background:#eee;font-size:11px}.badge.off{background:#fbe5e5;color:#8b2222}.send{background:#111;color:#fff;margin-top:10px;font-weight:700}.status{margin-top:10px;white-space:pre-wrap}.file{padding:8px}.counter{font-weight:700;margin:8px 0}@media(max-width:600px){.filters{grid-template-columns:1fr}.tools{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
{% include "_staff_back_button.html" %}
<h1>📢 Персональная рассылка</h1>
<div class="card"><div class="filters"><input id="query" placeholder="Имя или номер телефона"><select id="discipline"><option value="all">Все дисциплины</option></select></div><div class="tools"><button id="selectAll" type="button">Выбрать всех</button><button id="clearAll" class="secondary" type="button">Снять выбор</button></div><div class="counter" id="counter">Выбрано: 0</div><div id="list"><p class="muted">Загрузка...</p></div></div>
<div class="card"><h3>Сообщение</h3><textarea id="text" maxlength="4096" placeholder="Текст для выбранных клиентов"></textarea><select id="discount"><option value="">Без привязки скидки</option>{% for d in discounts %}<option value="{{ d.id }}">{{ d.name }} · {{ (d.value / 100) if d.kind == 'fixed' else d.value }}{% if d.kind == 'percent' %}%{% else %} ₽{% endif %}</option>{% endfor %}</select><div class="muted">Если выбрать скидку, она одновременно привяжется к выбранным атлетам по тем же правилам, что в разделе скидок.</div><input id="media" class="file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime"><div class="muted">Можно отправить текст, фото или видео. Для фото/видео подпись — до 1024 символов.</div><button id="send" class="send" type="button">Отправить выбранным</button><div id="status" class="status"></div></div>
</div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||new URLSearchParams(location.search).get('init_data')||'',cid={{club_id}},query=document.getElementById('query'),discipline=document.getElementById('discipline'),list=document.getElementById('list'),counter=document.getElementById('counter'),status=document.getElementById('status');let rows=[],selected=new Set(),timer,sending=false,operationKey=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function resetOperation(){if(!sending)operationKey=null}
function updateCounter(){counter.textContent='Выбрано: '+selected.size;document.querySelectorAll('[data-student]').forEach(x=>x.checked=selected.has(Number(x.value)))}
function render(){list.innerHTML=rows.map(s=>`<label class="student"><input type="checkbox" data-student value="${s.id}" ${selected.has(s.id)?'checked':''}><span class="student-main"><span class="student-name">${esc(s.name)}</span><span class="badge ${s.active_subscription?'':'off'}">${s.active_subscription?'абонемент активен':'абонемент неактивен'}</span><br><span class="muted">${esc(s.phone||'номер не указан')} · ${esc(s.discipline||'дисциплина не указана')} · получателей: ${s.recipient_count}</span></span></label>`).join('')||'<p class="muted">Ничего не найдено</p>';document.querySelectorAll('[data-student]').forEach(x=>x.onchange=()=>{resetOperation();const id=Number(x.value);x.checked?selected.add(id):selected.delete(id);updateCounter()});updateCounter()}
async function load(){status.textContent='';const r=await fetch(`/webapp/admin-broadcast/students?club_id=${cid}&discipline=${encodeURIComponent(discipline.value)}&q=${encodeURIComponent(query.value)}&init_data=${encodeURIComponent(init)}`);const d=await r.json().catch(()=>({}));if(!r.ok){status.textContent=d.detail||'Не удалось загрузить список';return}rows=d.students||[];const current=discipline.value;discipline.innerHTML='<option value="all">Все дисциплины</option>'+(d.disciplines||[]).map(x=>`<option value="${esc(x.code)}">${esc(x.name)}${x.active?'':' (выключена)'}</option>`).join('');discipline.value=(d.disciplines||[]).some(x=>x.code===current)?current:'all';render()}
query.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};discipline.onchange=load;document.getElementById('selectAll').onclick=()=>{resetOperation();rows.forEach(x=>selected.add(x.id));updateCounter()};document.getElementById('clearAll').onclick=()=>{resetOperation();selected.clear();updateCounter()};document.getElementById('text').oninput=resetOperation;document.getElementById('media').onchange=resetOperation;
document.getElementById('send').onclick=async()=>{if(sending)return;const text=document.getElementById('text').value.trim(),file=document.getElementById('media').files[0],discount=document.getElementById('discount').value;if(!selected.size)return alert('Выберите хотя бы одного получателя');if(!text&&!file)return alert('Добавьте текст, фото или видео');sending=true;operationKey=operationKey||((crypto.randomUUID&&crypto.randomUUID())||Date.now()+'-'+Math.random());const fd=new FormData();fd.append('club_id',cid);fd.append('init_data',init);fd.append('student_ids',JSON.stringify([...selected]));fd.append('text',text);fd.append('idempotency_key',operationKey);if(discount)fd.append('discount_id',discount);if(file)fd.append('media',file);const b=document.getElementById('send');b.disabled=true;status.textContent='Отправляем...';try{const r=await fetch('/webapp/admin-broadcast/send',{method:'POST',body:fd}),d=await r.json().catch(()=>({}));status.textContent=r.ok?`Готово. Доставлено: ${d.delivered}, ошибок: ${d.failed}.`:(d.detail||'Ошибка отправки');if(r.ok&&Number(d.failed||0)===0)operationKey=null}catch(e){status.textContent='Ошибка сети: '+e.message}finally{sending=false;b.disabled=false}};document.getElementById('discount').onchange=resetOperation;load();
</script></body></html>
