<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход по биометрии</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/mono.css') }}?v=1.1.0">
    <style>
        {% if loading.enabled %}body { opacity: 0; } #app-loader { opacity: 1; position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f4f4f4; } #app-loader img { width: 96px; height: 96px; object-fit: contain; border-radius: 22px; margin-bottom: 18px; filter: grayscale(1); -webkit-transform: translateZ(0); backface-visibility: hidden; } #app-loader .spinner { width: 28px; height: 28px; border: 3px solid #d5d5d5; border-top-color: #111111; border-radius: 50%; animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }{% endif %}
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f4f4; color: #111; padding: 18px; padding-top: max(18px, env(safe-area-inset-top)); padding-bottom: max(18px, env(safe-area-inset-bottom)); text-align: center; }
        .wrap { width: 100%; max-width: 760px; margin: 0 auto; }
        .top { background: linear-gradient(180deg,#fff,#fafafa); border: 1px solid #d9d9d9; border-radius: 24px; padding: 20px; box-shadow: 0 14px 40px rgba(0,0,0,.06); margin-bottom: 12px; text-align: left; }
        .eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 11px; color: #666; }
        h2 { font-size: 30px; letter-spacing: -.03em; margin: 8px 0 4px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #111; color: white; border: 1px solid #111; border-radius: 16px; font-size: 16px; cursor: pointer; font-weight: 700; }
        .student-card { display: block; width: 100%; appearance: none; -webkit-appearance: none; background: white; padding: 15px; margin-bottom: 10px; border-radius: 18px; box-shadow: 0 10px 24px rgba(0,0,0,0.05); border: 1px solid #ddd; transition: 0.2s; text-align: left; color: #111; font: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: rgba(0,0,0,.12); pointer-events: auto; }
        .selected-card { border-color: #111; background: #fff !important; color: #111 !important; }
        .student-card, .student-card h3, .student-card p { color: #111 !important; }
        .student-card { background: #fff !important; }
        .mono-action { display: block; text-decoration: none; padding: 15px 16px; border-radius: 16px; border: 1px solid #111; color: #111; background: #fff; font-weight: 700; margin: 10px 0; }
        .cardlist { display: grid; gap: 10px; }
        .hint { color:#666; font-size:14px; line-height:1.5; }
        .top, .student-card, .mono-action, .btn, #setup-biometry-box {
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        @media (max-width: 540px) {
            body { padding: 12px; }
            h2 { font-size: 24px; }
            .top { padding: 16px; border-radius: 20px; }
            .student-card, .mono-action, .btn { border-radius: 14px; }
            .mono-action, .btn { padding: 14px 12px; }
        }
    </style>
</head>
<body class="mono-theme">
{% if loading.enabled %}<div id="app-loader"><img id="app-loader-logo" src="{{ logo_url or url_for('static', path='img/logo.png') }}" loading="eager" decoding="async" fetchpriority="high" onerror="this.style.display='none'"><div>{{ loading.message }}</div><div class="spinner"></div></div>{% endif %}
<div class="wrap">
    <div class="top">
        <div class="eyebrow">{{ club_name or 'Клуб' }} · Access</div>
        <h2>Face ID</h2>
        <p style="color:#666;margin:0;">Безопасный проход по биометрии</p>
    </div>
    <a class="mono-action" href="/webapp/client-cabinet?club_id={{ club_id }}">← Назад в кабинет</a>
    <div id="setup-biometry-box" style="display:none; background:#fff; padding:15px; margin-bottom:20px; border-radius:18px; border:1px solid #ddd;">
        <p style="margin:0 0 10px 0; color:#444;">🔒 Для активации прохода нужно один раз связать устройство с профилем</p>
        <button class="btn" style="margin:0;" onclick="setupBiometrics()">Активировать доступ</button>
    </div>
    <p style="color:#666;" id="status-hint">Выберите атлета для прохода:</p>
    <div id="students-list">
        {% for student in students %}
        <button type="button" class="student-card" id="card-{{ student.id }}" data-student-id="{{ student.id }}" data-student-name="{{ student.name }}">
            <h3 style="margin:0 0 6px 0;">{{ student.name }}</h3>
            <p style="margin:0;color:#666;">Баланс: {{ student.balance_lessons }} занятий</p>
        </button>
        {% endfor %}
    </div>
</div>
<script>
{% if loading.enabled %}
const loaderLogo = document.getElementById('app-loader-logo');
if (loaderLogo && loaderLogo.dataset && loaderLogo.dataset.src !== loaderLogo.src) {
    loaderLogo.dataset.src = loaderLogo.src;
    const preload = new Image();
    preload.onload = () => { loaderLogo.src = preload.src; };
    preload.onerror = () => { loaderLogo.style.display = 'none'; };
    preload.src = loaderLogo.dataset.src;
}
setTimeout(() => { document.body.style.opacity = '1'; document.getElementById('app-loader')?.remove(); }, {{ loading.duration_ms }});
{% endif %}
const tg = window.Telegram?.WebApp;
if (!tg) {
    const hint = document.getElementById('status-hint');
    if (hint) {
        hint.textContent = 'Откройте этот экран внутри Telegram WebApp.';
        hint.className = 'hint';
    }
} else {
    tg.expand();
}
const bm = tg?.BiometricManager;
const serverBiometryEnabled = {{ 'true' if biometric_enabled else 'false' }};
let selectedStudentId = null;
let isBiometricReady = false;
document.querySelectorAll('.student-card').forEach((card) => {
    card.addEventListener('click', (event) => {
        event.preventDefault();
        selectStudent(card.dataset.studentId, card.dataset.studentName || 'атлет');
    }, { passive: false });
});
if (!bm || typeof bm.init !== 'function') {
    const hint = document.getElementById('status-hint');
    if (hint) {
        hint.textContent = 'На этом устройстве биометрический API Telegram WebApp недоступен. Используйте QR-пропуск из меню бота.';
        hint.className = 'hint';
    }
    const setupBox = document.getElementById('setup-biometry-box');
    if (setupBox) setupBox.style.display = 'none';
} else {
    bm.init(() => {
        isBiometricReady = true;
        if (!bm.isAccessGranted && !serverBiometryEnabled) {
            const setupBox = document.getElementById('setup-biometry-box');
            if (setupBox) setupBox.style.display = 'block';
            const hint = document.getElementById('status-hint');
            if (hint) hint.textContent = 'Выберите атлета, затем активируйте Face ID сверху.';
        }
    });
}
function setupBiometrics() {
    if (!bm || !isBiometricReady) return;
    bm.requestAccess({ reason: "Создание безопасного ключа устройства для прохода" }, (accessGranted) => {
        if (accessGranted) {
            fetch('/webapp/enable-biometry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ init_data: tg.initData }) })
            .then(res => res.json())
            .then(() => { tg.showAlert("Устройство успешно связано. Теперь доступ готов."); location.reload(); });
        } else {
            tg.showAlert("Доступ отклонен. Без активации проход невозможен.");
        }
    });
}
function selectStudent(studentId, studentName) {
    selectedStudentId = studentId;
    document.querySelectorAll('.student-card').forEach(c => c.classList.remove('selected-card'));
    document.getElementById(`card-${studentId}`).classList.add('selected-card');
    if (!tg) return;
    if (!bm || (!bm.isAccessGranted && !serverBiometryEnabled)) {
        tg.showAlert("Атлет выбран. Сначала активируйте Face ID по кнопке сверху.");
        return;
    }
    tg.MainButton.text = `ПРОПУСТИТЬ: ${studentName.toUpperCase()}`;
    tg.MainButton.textColor = "#FFFFFF";
    tg.MainButton.color = "#111111";
    tg.MainButton.show();
}
if (tg) tg.onEvent('mainButtonClicked', function() {
    if (!selectedStudentId) return;
    tg.MainButton.disable();
    if (!bm || typeof bm.authenticate !== 'function') {
        tg?.showAlert("Биометрия на этом устройстве недоступна.");
        tg?.MainButton.enable();
        return;
    }
    const authenticate = () => bm.authenticate({ reason: "Подтвердите личность для прохода" }, (isAuthenticated, biometricToken) => {
        if (isAuthenticated) {
            fetch('/webapp/open-turnstile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ student_id: parseInt(selectedStudentId), biometric_token: biometricToken || "verified_by_device", init_data: tg.initData }) })
            .then(res => res.json())
            .then(data => { if (data.success) { tg.showAlert(data.message || "Турникет открыт!"); setTimeout(() => tg.close(), 1500); } else { tg.showAlert("Ошибка СКУД: " + data.message); } });
        } else {
            tg.showAlert("Биометрия не пройдена.");
        }
    });
    if (!bm.isAccessGranted) {
        bm.requestAccess({ reason: "Подтвердите доступ к Face ID для прохода" }, (accessGranted) => {
            if (accessGranted) authenticate();
            else { tg.showAlert("Доступ к Face ID не предоставлен."); tg.MainButton.enable(); }
        });
    } else {
        authenticate();
    }
});
</script>
</body>
</html>
<style>body.mono-theme,body.mono-theme html{background:#090909!important;color:#f7f7f7!important}body.mono-theme .hero,body.mono-theme .top,body.mono-theme .card,body.mono-theme .mono-card,body.mono-theme .mono-hero,body.mono-theme .pill,body.mono-theme .mono-pill{background:#151515!important;color:#f7f7f7!important;border-color:#2d2d2d!important;box-shadow:0 16px 42px rgba(0,0,0,.28)!important}body.mono-theme h1,body.mono-theme h2,body.mono-theme h3,body.mono-theme h4,body.mono-theme .mono-title,body.mono-theme b{color:#fff!important}body.mono-theme p,body.mono-theme .subtitle,body.mono-theme .muted,body.mono-theme .label,body.mono-theme .eyebrow,body.mono-theme .coach,body.mono-theme .hint{color:#aaa!important}body.mono-theme input,body.mono-theme select,body.mono-theme textarea{background:#101010!important;color:#fff!important;border-color:#444!important}body.mono-theme .btn,body.mono-theme button,body.mono-theme .mono-action.dark{background:#fff!important;color:#090909!important;border-color:#fff!important}body.mono-theme .student-card,body.mono-theme .student-card.selected-card{background:#fff!important;color:#111!important;border-color:#ddd!important}body.mono-theme .student-card h3,body.mono-theme .student-card p{color:#111!important}</style>
