<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:sans-serif;background:#090909;color:#fff;padding:14px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:900px;margin:0 auto 10px}.nav a{padding:10px 12px;border-radius:10px;border:1px solid #555;background:#111;color:#fff;text-decoration:none;text-align:center;font-weight:700}.nav a.secondary{background:#fff;color:#111;border-color:#fff}.card{background:#151515;border:1px solid #333;border-radius:14px;padding:14px;margin:10px auto;max-width:900px}input,select,button{padding:9px;margin:3px;border-radius:8px;border:1px solid #555;background:#111;color:#fff}button{background:#fff;color:#111;font-weight:bold}.tariff{border-top:1px solid #333;padding:8px 0}.muted{color:#aaa}
</style>
<div class="nav"><a href="/admin?club_id={{club_id}}&init_data={{ request.query_params.get('init_data','')|urlencode }}">← В панель</a><a class="secondary" href="#" onclick="window.Telegram?.WebApp?.close(); return false;">Закрыть</a></div>
<div id="root"></div>
<script>
const tg = Telegram.WebApp;
tg.ready();
const cid = {{ club_id }};
const disciplines = {{ disciplines|tojson }};
const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey = `adm_tariffs_disc_${cid}`;
let selected = localStorage.getItem(storageKey) || Object.keys(disciplines)[0];

function draw() {
  const d = disciplines[selected] || {};
  root.innerHTML = `<div class="card">
    <h2>Тарифы и дисциплины</h2>
    <select id="d">${Object.entries(disciplines).map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${esc(v.name||k)}</option>`).join('')}</select>
    <button id="active">${d.active?'Выключить':'Включить'} направление</button>
    <button id="kind">Тип: ${d.type==='unlimited'?'Безлимит':'По занятиям'}</button>
    <p class="muted">Изменения синхронизируются с ботом автоматически.</p>
    ${(d.tariffs||[]).map((t,i)=>`<div class="tariff"><input id="p${i}" type="number" step="0.01" value="${t.price||0}"> ₽ <input id="days${i}" type="number" value="${t.days||30}"> дней <input id="count${i}" type="number" value="${t.count||0}" ${d.type==='unlimited'?'disabled':''}> занятий <button data-save="${i}">Сохранить</button><button data-del="${i}">Удалить</button></div>`).join('')}
    <h3>Новый тариф</h3><input id="np" type="number" step="0.01" placeholder="Цена ₽"><input id="nd" type="number" value="30" placeholder="Дней"><input id="nc" type="number" value="0" placeholder="Занятий"><button id="add">Добавить</button>
  </div>`;
  document.getElementById('d').onchange = () => { selected = document.getElementById('d').value; localStorage.setItem(storageKey, selected); draw(); };
  active.onclick = () => change('toggle_active');
  kind.onclick = () => change('toggle_type');
  add.onclick = () => change('add', null, {price:np.value, days:nd.value, count:nc.value});
  root.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.save);change('update',i,{price:document.getElementById('p'+i).value,days:document.getElementById('days'+i).value,count:document.getElementById('count'+i).value})});
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>change('delete',Number(b.dataset.del)));
}
async function change(action,index,tariff){
  const r=await fetch('/webapp/admin-tariffs/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:cid,discipline:selected,action,index,tariff})});
  const x=await r.json();
  if(!r.ok) return alert(x.detail||'Ошибка');
  location.reload();
}
draw();
</script>
</html>
