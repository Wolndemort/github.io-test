<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font-family:sans-serif;background:#090909;color:#f7f7f7;padding:14px 14px 92px}.cart{background:#151515;border:1px solid #2d2d2d;border-radius:14px;padding:14px;margin:10px 0}button,.link,select{display:inline-block;padding:10px 12px;border:0;border-radius:8px;background:#fff;color:#090909;font-weight:700;margin:2px;cursor:pointer}#checkout{width:100%;font-size:16px}.paybar{position:sticky;bottom:0;z-index:4;background:#090909;padding-top:10px}#back{background:#1b1b1b;color:#fff;border:1px solid #444;width:100%}.muted{color:#aaa}.pay-method{width:100%;box-sizing:border-box}</style>
<a id="back" class="link" href="/webapp/shop?club_id={{club_id}}">← Вернуться к покупкам</a><h2>Корзина</h2><div id="cart" class="cart"></div><b id="total">Итого: 0 ₽</b>
<div class="paybar">
  <label style="display:block;margin-bottom:8px;">Способ оплаты
    <select id="payment_method" class="pay-method">
      <option value="bank_card">Картой</option>
      <option value="sbp" {% if not sbp_enabled %}disabled{% endif %}>СБП{% if not sbp_enabled %} (недоступно){% endif %}</option>
      <option value="requisites">По реквизитам</option>
    </select>
  </label>
  <div class="muted" style="margin-bottom:8px;">Реквизиты совпадают с ботом: <b>{{ payment_info }}</b></div>
  <button id="checkout" disabled>Оплатить корзину</button>
  <button id="clear" style="margin-top:8px;width:100%">Очистить корзину</button>
</div>
<script>
const tg=Telegram.WebApp;tg.ready(),cartEl=document.getElementById('cart');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=()=>JSON.parse(localStorage.getItem('speedy_cart')||'[]'),save=x=>localStorage.setItem('speedy_cart',JSON.stringify(x));
function draw(){const items=read();let sum=0;cartEl.innerHTML=items.map((x,i)=>{sum+=Number(x.price||0)*Number(x.quantity||1);const max=x.item_type==='product'?Number(x.max||0):999;return `<div style="padding:8px 0;border-bottom:1px solid #333"><b>${esc(x.name||x.item_type)}</b><br>${(Number(x.price||0)/100).toFixed(2)} ₽ × ${x.quantity||1}<br><button data-minus="${i}">−</button><button data-plus="${i}" ${x.quantity>=max?'disabled':''}>+</button><button data-remove="${i}">Удалить</button>${x.item_type==='product'?`<small style="display:block;color:#aaa">Остаток: ${max}</small>`:''}</div>`}).join('')||'<span class="muted">Корзина пуста.</span>';document.getElementById('total').textContent='Итого: '+(sum/100).toFixed(2)+' ₽';document.getElementById('checkout').disabled=!sum;cartEl.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const x=read(),i=Number(b.dataset.minus);x[i].quantity=(x[i].quantity||1)-1;if(x[i].quantity<1)x.splice(i,1);save(x);draw()});cartEl.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const x=read(),i=Number(b.dataset.plus),max=x[i].item_type==='product'?Number(x[i].max||0):999;if(x[i].quantity<max)x[i].quantity=(x[i].quantity||1)+1;save(x);draw()});cartEl.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const x=read();x.splice(Number(b.dataset.remove),1);save(x);draw()})}
document.getElementById('clear').onclick=()=>{localStorage.removeItem('speedy_cart');draw()};
document.getElementById('checkout').onclick=async()=>{
  const b=document.getElementById('checkout');
  b.disabled=true;
  const r=await fetch('/webapp/cart/checkout',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      init_data:tg.initData,
      club_id:{{club_id}},
      items:read(),
      payment_method:document.getElementById('payment_method').value
    })
  }),d=await r.json();
  if(!r.ok){alert(d.detail||'Ошибка');b.disabled=false;return}
  localStorage.removeItem('speedy_cart');
  if(d.payment_url){
    const tg = window.Telegram?.WebApp;
    if (tg?.openLink) tg.openLink(d.payment_url, {try_instant_view: false});
    else location.href = d.payment_url;
  } else if(d.charged){
    alert(d.message||'Оплата прошла по сохраненной карте');
    draw()
  } else {
    alert(d.message||'Готово');
    draw()
  }
};
draw();
</script></html>
