{% extends "webapp_base.html" %}
{% block title %}Профиль{% endblock %}
{% block header %}Профиль{% endblock %}
{% block subheader %}{{ club.name }}{% endblock %}
{% block content %}
<div class="mono-card">
    <label style="display:block;">Номер телефона
        <input id="phone" type="tel" placeholder="+7..." style="width:100%;padding:12px;margin-top:6px;">
    </label>
    <div class="mono-divider"></div>
    <button id="bind" class="mono-action dark" style="width:100%;">Привязать номер</button>
    <a class="mono-action" style="margin-top:10px;" href="/webapp/client-cabinet?club_id={{ club_id }}">Назад</a>
    <p id="msg"></p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('bind').addEventListener('click', async () => {
  const payload = {init_data: window.Telegram?.WebApp?.initData || '', club_id: {{ club_id }}, phone: document.getElementById('phone').value};
  const res = await fetch('/webapp/client-cabinet/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  const data = await res.json();
  document.getElementById('msg').innerText = res.ok ? data.message : (data.detail || 'Ошибка');
});
</script>
{% endblock %}
