{% extends "webapp_base.html" %}
{% block title %}Абонемент{% endblock %}
{% block header %}Абонемент{% endblock %}
{% block subheader %}{{ club.name }}{% endblock %}
{% block content %}
<style>
    .mono-card, .mono-action, label, select, button, p {
        overflow-wrap: anywhere;
        word-break: break-word;
    }
    @media (max-width: 540px) {
        .mono-grid-2 { grid-template-columns: 1fr !important; }
        select, button, .mono-action { font-size: 16px; }
    }
</style>
<div class="mono-card">
    <div class="mono-grid-2">
        <label>Атлет
            <select id="student" style="width:100%;padding:12px;margin-top:6px;">
                {% for s in students %}
                <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Направление
            <select id="sport" style="width:100%;padding:12px;margin-top:6px;">
                {% for code, info in disciplines.items() %}
                <option value="{{ code }}">{{ info.name if info.name else code }}</option>
                {% endfor %}
            </select>
        </label>
    </div>
    <label style="display:block;margin-top:12px;">Тариф
        <select id="tariff" style="width:100%;padding:12px;margin-top:6px;"></select>
    </label>
    <div class="mono-divider"></div>
    <button id="create" class="mono-action dark" style="width:100%;">Добавить в корзину</button>
    <p id="msg"></p>
</div>
<div class="mono-sticky-bottom">
    <div class="mono-card">
        <div class="mono-bottom-actions">
            <a class="mono-action dark" href="/webapp/cart?club_id={{ club_id }}">🛒 Открыть корзину</a>
            <a class="mono-action" href="/webapp/client-cabinet?club_id={{ club_id }}">← Назад в кабинет</a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const disciplines = {{ disciplines | tojson }};
const sportSelect = document.getElementById('sport');
const tariffSelect = document.getElementById('tariff');
const studentSelect = document.getElementById('student');
function renderTariffs() {
  const tariffs = (disciplines[sportSelect.value] || {}).tariffs || [];
  tariffSelect.innerHTML = '';
  if (!tariffs.length) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = 'Тарифы недоступны';
    tariffSelect.appendChild(opt);
    document.getElementById('create').disabled = true;
    document.getElementById('msg').innerText = 'Для выбранного направления пока нет тарифов.';
    return;
  }
  document.getElementById('create').disabled = false;
  document.getElementById('msg').innerText = '';
  tariffs.forEach((t, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = (t.count === 999 ? `Безлимит ${t.days} дн.` : `${t.count} зан. / ${t.days} дн.`) + ` — ${t.price} ₽`;
    tariffSelect.appendChild(opt);
  });
}
sportSelect.addEventListener('change', renderTariffs);
renderTariffs();
document.getElementById('create').addEventListener('click', async () => {
  const button = document.getElementById('create');
  button.disabled = true;
  button.textContent = 'Создаём ссылку...';
  const items = JSON.parse(localStorage.getItem('speedy_cart') || '[]');
  const selected = (disciplines[sportSelect.value].tariffs || [])[Number(tariffSelect.value)];
  items.push({item_type:'subscription', student_id:Number(studentSelect.value), sport_type:sportSelect.value, tariff_idx:Number(tariffSelect.value), quantity:1, name:'Абонемент', price:Number(selected.price)*100});
  localStorage.setItem('speedy_cart', JSON.stringify(items));
  button.disabled = false;
  button.textContent = 'Добавить в корзину';
  document.getElementById('msg').innerText = 'Абонемент добавлен в корзину. Можно продолжать покупки.';
});
</script>
{% endblock %}
<style>body.mono-theme,body.mono-theme html{background:#090909!important;color:#f7f7f7!important}body.mono-theme .hero,body.mono-theme .top,body.mono-theme .card,body.mono-theme .mono-card,body.mono-theme .mono-hero,body.mono-theme .pill,body.mono-theme .mono-pill{background:#151515!important;color:#f7f7f7!important;border-color:#2d2d2d!important;box-shadow:0 16px 42px rgba(0,0,0,.28)!important}body.mono-theme h1,body.mono-theme h2,body.mono-theme h3,body.mono-theme h4,body.mono-theme .mono-title,body.mono-theme b{color:#fff!important}body.mono-theme p,body.mono-theme .subtitle,body.mono-theme .muted,body.mono-theme .label,body.mono-theme .eyebrow,body.mono-theme .coach,body.mono-theme .hint{color:#aaa!important}body.mono-theme input,body.mono-theme select,body.mono-theme textarea{background:#101010!important;color:#fff!important;border-color:#444!important}body.mono-theme .btn,body.mono-theme button,body.mono-theme .mono-action.dark{background:#fff!important;color:#090909!important;border-color:#fff!important}</style>
<script>(function(){const b=document.createElement('button');b.textContent='Купить сейчас';b.className='mono-action dark';b.style='width:100%;margin-top:8px';document.getElementById('create')?.after(b);b.onclick=async()=>{b.disabled=true;const p={init_data:window.Telegram?.WebApp?.initData||'',club_id:{{club_id}},student_id:Number(document.getElementById('student').value),sport_type:document.getElementById('sport').value,tariff_idx:Number(document.getElementById('tariff').value)};const r=await fetch('/webapp/client-cabinet/buy-subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json();if(r.ok&&d.payment_url)location.href=d.payment_url;else{alert(d.detail||'Ошибка');b.disabled=false}}})();</script>
