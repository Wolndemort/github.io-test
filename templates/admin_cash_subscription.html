<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Продажа наличного абонемента</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/mono.css') }}">
  <style>
    body{margin:0;background:#f4f4f2;color:#111;font-family:system-ui,sans-serif}
    .shell{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e4e4;border-radius:18px;padding:20px;margin-bottom:12px}
    .hero{background:#111;color:#fff;border-radius:20px;padding:24px;margin-bottom:14px}.hero h1{margin:8px 0;font-size:32px}
    .muted{color:#777;font-size:13px}.hero .muted{color:#bbb}.search,.select,.button{width:100%;padding:13px;border-radius:10px;border:1px solid #ccc;background:#fff;font:inherit;box-sizing:border-box}
    .search{margin-top:14px}.button{background:#111;color:#fff;border-color:#111;font-weight:800;cursor:pointer}.button:disabled{opacity:.5}
    .student{display:block;width:100%;text-align:left;background:#fff;border:1px solid #ddd;border-radius:10px;padding:13px;margin-top:7px;font:inherit;cursor:pointer}
    .student:hover{border-color:#111}.form-grid{display:grid;gap:10px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#777;font-weight:800}
    .back{display:inline-block;color:#111;text-decoration:none;font-weight:700;margin-bottom:12px}.selected{font-size:20px;font-weight:800;margin-bottom:15px}
    .discount{min-height:100px}.notice{padding:12px;border-radius:10px;background:#f1f1f1;font-size:13px}
    @media(min-width:600px){.form-grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
  </style>
</head>
<body>
<main class="shell">
  <a class="back" href="/webapp/client-cabinet?club_id={{ club_id }}">← В рабочий кабинет</a>
  <section class="hero"><div class="muted">Касса · абонементы</div><h1>Продажа наличного абонемента</h1><div class="muted">Выберите атлета, дисциплину, тариф и применяемые скидки.</div></section>
  <section class="card"><div class="label">Атлет</div><input id="search" class="search" placeholder="Поиск атлета"><div id="students"></div></section>
  <section id="sale" class="card" hidden><div id="selected" class="selected"></div><div class="form-grid">
    <label class="label">Дисциплина<select id="discipline" class="select"></select></label>
    <label class="label">Тариф<select id="tariff" class="select"></select></label>
    <label class="label full">Скидки<br><select id="discount" class="select discount" multiple size="4"><option value="">Без скидки</option>{% for d in discounts %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></label>
    <div id="summary" class="notice full">Выберите тариф</div><button id="submit" class="button full">Продать абонемент</button>
  </div></section>
</main>
<script>
const tg=window.Telegram.WebApp;tg.ready();
const init=tg.initData,students={{ students|tojson }},disciplines={{ disciplines|tojson }};
const search=document.getElementById('search'),list=document.getElementById('students'),sale=document.getElementById('sale'),selectedEl=document.getElementById('selected'),discipline=document.getElementById('discipline'),tariff=document.getElementById('tariff'),discount=document.getElementById('discount'),summary=document.getElementById('summary'),submit=document.getElementById('submit');
let selected=null;
function render(){const q=search.value.trim().toLowerCase();list.innerHTML=students.filter(s=>String(s.name||'').toLowerCase().includes(q)).map(s=>{const b=document.createElement('button');b.className='student';b.type='button';b.innerHTML='<b>'+String(s.name||'')+'</b><br><span class="muted">'+String(s.discipline||'')+'</span>';b.onclick=()=>pick(s.id);return b.outerHTML}).join('')||'<div class="muted" style="margin-top:12px">Атлеты не найдены</div>'}
function pick(id){selected=students.find(s=>s.id===id);sale.hidden=false;selectedEl.textContent=selected.name;discipline.innerHTML=Object.entries(disciplines).map(([k,v])=>'<option value="'+k+'">'+(v.name||k)+'</option>').join('');fill()}
function fill(){const ts=disciplines[discipline.value]?.tariffs||[];tariff.innerHTML=ts.map((t,i)=>'<option value="'+i+'">'+(t.name||((t.count==999)?'Безлимит':t.count+' посещений'))+' · '+t.price+' ₽</option>').join('');const t=ts[Number(tariff.value)||0];summary.textContent=t?'Тариф: '+(t.name||((t.count==999)?'Безлимит':t.count+' посещений'))+' · '+t.price+' ₽':'Тариф не выбран'}
search.addEventListener('input',render);discipline.addEventListener('change',fill);tariff.addEventListener('change',fill);
submit.addEventListener('click',async()=>{if(!selected)return;submit.disabled=true;const r=await fetch('/webapp/admin-cash-subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:init,club_id:{{ club_id }},student_id:selected.id,sport_type:discipline.value,tariff_idx:Number(tariff.value),discount_ids:[...discount.selectedOptions].map(x=>Number(x.value)).filter(Boolean)})});const d=await r.json();submit.disabled=false;if(!r.ok)return alert(d.detail||'Ошибка продажи');alert('Продано до '+d.expire_date);location.reload()});
render();
</script>
</body></html>
