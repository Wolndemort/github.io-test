<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Продажа наличного абонемента</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font-family:sans-serif;background:#111;color:#fff;padding:16px}.wrap{max-width:760px;margin:auto}.card{background:#1d1d1d;border:1px solid #444;border-radius:16px;padding:16px;margin-bottom:12px}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #777;background:#111;color:#fff}button{background:#fff;color:#111;font-weight:700}.student{padding:12px;border:1px solid #444;border-radius:10px;margin:8px 0;cursor:pointer}.muted{color:#aaa;font-size:13px}.hidden{display:none}</style></head>
<body><div class="wrap"><div class="card"><h2>💵 Наличный абонемент</h2><input id="search" placeholder="Поиск атлета по имени"><div id="students"></div></div><div id="sale" class="card hidden"><h3 id="selected"></h3><div id="current" class="muted"></div><label>Направление<select id="discipline"></select></label><label>Тариф<select id="tariff"></select></label><button id="submit">Принять наличные и продать</button><button type="button" id="back">Назад к поиску</button></div></div>
<a href="/webapp/client-cabinet?club_id={{ club_id }}" style="display:block;text-align:center;text-decoration:none;padding:12px;border:1px solid #555;border-radius:12px;background:#fff;color:#111;font-weight:700;margin-bottom:10px">← В рабочий кабинет</a><div style="font-size:20px;font-weight:800;margin:4px 0 10px">💵 Продажа наличного абонемента</div>
<script>
window.cashSubscriptionIdempotencyKey=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const originalCashSubscriptionFetch=window.fetch.bind(window);
window.fetch=(input, options={})=>{
  if(String(input).includes('/webapp/admin-cash-subscription') && options.body){
    try{const body=JSON.parse(options.body);body.idempotency_key=window.cashSubscriptionIdempotencyKey;options={...options,body:JSON.stringify(body)};}catch(_){}
  }
  const result=originalCashSubscriptionFetch(input, options);
  if(String(input).includes('/webapp/admin-cash-subscription')) return result.then(response=>{if(!response.ok)document.getElementById('submit').disabled=false;return response;});
  return result;
};
document.addEventListener('click', event=>{if(event.target?.id==='submit')event.target.disabled=true;});
</script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||new URLSearchParams(location.search).get('init_data')||'';const students={{ students|tojson }};const disciplines={{ disciplines|tojson }};let selected=null;
function label(s){const active=s.expire_date&&new Date(s.expire_date)>new Date()&&!s.is_frozen;const state=s.is_frozen?'❄️ заморожен':(active?'✅ действует':'❌ закончен');const balance=s.balance_lessons===999?'безлимит':`${s.balance_lessons||0} зан.`;const until=s.expire_date?new Date(s.expire_date).toLocaleDateString('ru-RU'):'без даты';return `${state} · ${balance} · до ${until}`}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('students').innerHTML=students.filter(s=>s.name.toLowerCase().includes(q)).map(s=>`<div class="student" data-id="${s.id}"><b>${s.name}</b><div class="muted">${label(s)}</div></div>`).join('')||'<div class="muted">Ничего не найдено</div>';document.querySelectorAll('.student').forEach(x=>x.onclick=()=>pick(Number(x.dataset.id)))}
function pick(id){selected=students.find(s=>s.id===id);document.getElementById('sale').classList.remove('hidden');document.getElementById('selected').textContent=selected.name;document.getElementById('current').textContent=label(selected);const d=document.getElementById('discipline');d.innerHTML=Object.entries(disciplines).map(([k,v])=>`<option value="${k}" ${k===selected.discipline?'selected':''}>${v.name||k}</option>`).join('');fill()}
function fill(){const cfg=disciplines[document.getElementById('discipline').value]||{};document.getElementById('tariff').innerHTML=(cfg.tariffs||[]).map((t,i)=>`<option value="${i}">${t.name||'Тариф '+(i+1)} — ${t.count||0} зан. / ${t.days||30} дн. — ${t.price||0} ₽</option>`).join('')}
document.getElementById('search').oninput=render;document.getElementById('discipline').onchange=fill;document.getElementById('back').onclick=()=>document.getElementById('sale').classList.add('hidden');document.getElementById('submit').onclick=async()=>{const r=await fetch('/webapp/admin-cash-subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:init,club_id:{{ club_id }},student_id:selected.id,sport_type:document.getElementById('discipline').value,tariff_idx:Number(document.getElementById('tariff').value)})});const d=await r.json();if(!r.ok)return alert(d.detail||'Ошибка продажи');alert(`Продано. До: ${d.expire_date}. Остаток: ${d.balance_lessons===999?'безлимит':d.balance_lessons}`);location.reload()};render();
</script></body></html>
