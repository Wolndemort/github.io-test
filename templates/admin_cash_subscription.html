<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Наличный абонемент</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:sans-serif;background:#111;color:#fff;padding:16px}.wrap{max-width:760px;margin:auto}.card{background:#1d1d1d;border:1px solid #444;border-radius:16px;padding:16px;margin-bottom:12px}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #777;background:#111;color:#fff}button{background:#fff;color:#111;font-weight:700}.student{padding:12px;border:1px solid #444;border-radius:10px;margin:8px 0;cursor:pointer}.hidden{display:none}</style><div class="wrap"><div class="card"><h2>💵 Наличный абонемент</h2><input id="search" placeholder="Поиск атлета"><div id="students"></div></div><div id="sale" class="card hidden"><h3 id="selected"></h3><div id="current"></div><label>Направление<select id="discipline"></select></label><label>Тариф<select id="tariff"></select></label><label>Скидка<select id="discount"><option value="">Без скидки</option>{% for d in discounts %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select></label><button id="submit">Принять наличные и продать</button></div></div><script>const tg=Telegram.WebApp;tg.ready();const init=tg.initData||'';const students={{students|tojson}};const disciplines={{disciplines|tojson}};let selected;function render(){const q=search.value.toLowerCase();studentsEl.innerHTML=students.filter(s=>s.name.toLowerCase().includes(q)).map(s=>`<div class="student" onclick="pick(${s.id})"><b>${s.name}</b><br>${s.balance_lessons||0} занятий</div>`).join('')}function pick(id){selected=students.find(s=>s.id===id);sale.classList.remove('hidden');selectedEl.textContent=selected.name;discipline.innerHTML=Object.entries(disciplines).map(([k,v])=>`<option value="${k}">${v.name||k}</option>`).join('');fill()}function fill(){const c=disciplines[discipline.value]||{};tariff.innerHTML=(c.tariffs||[]).map((t,i)=>`<option value="${i}">${t.price} ₽ · ${t.days||30} дн.</option>`).join('')}const studentsEl=document.getElementById('students'),selectedEl=document.getElementById('selected');search.oninput=render;discipline.onchange=fill;submit.onclick=async()=>{submit.disabled=true;const r=await fetch('/webapp/admin-cash-subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:init,club_id:{{club_id}},student_id:selected.id,sport_type:discipline.value,tariff_idx:Number(tariff.value),discount_id:discount.value?Number(discount.value):null})});const d=await r.json();if(!r.ok){alert(d.detail||'Ошибка');submit.disabled=false}else{alert(`Продано. До: ${d.expire_date}`);location.reload()}};render()</script></html>
