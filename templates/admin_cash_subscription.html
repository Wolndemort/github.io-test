<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Наличный абонемент</title><!-- В рабочий кабинет · Продажа наличного абонемента · до ${until} --><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main><h1>Продажа наличного абонемента</h1><input id="search" placeholder="Поиск атлета"><div id="students"></div><section id="sale" hidden><h2 id="selected"></h2><select id="discipline"></select><select id="tariff"></select><select id="discount" multiple size="4"><option value="">Без скидки</option>{% for d in discounts %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select><button id="submit">Продать</button></section><a href="/webapp/client-cabinet?club_id={{club_id}}">В рабочий кабинет</a></main><script>const tg=Telegram.WebApp;tg.ready();const init=tg.initData,students={{students|tojson}},disciplines={{disciplines|tojson}};let selected;const list=document.getElementById('students');function render(){list.innerHTML=students.filter(s=>s.name.toLowerCase().includes(search.value.toLowerCase())).map(s=>`<button onclick="pick(${s.id})">${s.name}</button>`).join('')}function pick(id){selected=students.find(s=>s.id===id);sale.hidden=false;selectedEl.textContent=selected.name;discipline.innerHTML=Object.entries(disciplines).map(([k,v])=>`<option value="${k}">${v.name||k}</option>`).join('');fill()}function fill(){tariff.innerHTML=(disciplines[discipline.value]?.tariffs||[]).map((t,i)=>`<option value="${i}">${t.price} ₽ · ${t.days||30} дн.</option>`).join('')}search.oninput=render;discipline.onchange=fill;submit.onclick=async()=>{const r=await fetch('/webapp/admin-cash-subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:init,club_id:{{club_id}},student_id:selected.id,sport_type:discipline.value,tariff_idx:+tariff.value,discount_ids:[...discount.selectedOptions].map(x=>+x.value).filter(Boolean)})});const d=await r.json();if(!r.ok)return alert(d.detail||'Ошибка');alert(`Продано до ${d.expire_date}`);location.reload()};render()</script></body></html>
