<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090909;color:#f7f7f7;padding:14px}.wrap{max-width:700px;margin:auto}.card{background:#151515;border:1px solid #2d2d2d;border-radius:16px;padding:14px;margin:10px 0}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid #333;padding:11px 0}.muted{color:#aaa;font-size:13px}.qty{display:flex;align-items:center;gap:5px}.qty button{width:38px;height:38px;padding:0}.qty input{width:42px;text-align:center;padding:9px 2px}input,button{box-sizing:border-box;border-radius:9px;border:1px solid #444;background:#101010;color:#fff;font-size:15px}button{padding:10px;cursor:pointer}.pay{width:100%;margin-top:12px;background:#fff;color:#090909;font-weight:700}.pay:disabled{opacity:.45}.selected{border:1px solid #555;border-radius:10px;padding:9px;margin-top:10px}.selected:empty{display:none}h1,h2,b{color:#fff}
</style></head>
<body><div class="wrap">
<div class="card"><h2>Продажа товаров</h2><div class="muted">Нажимайте + у нужных товаров. Остатки спишутся после подтверждения наличной оплаты.</div></div>
<div class="card"><div id="items"></div></div>
<div class="card"><div id="selected" class="selected"></div><b id="total">Итого: 0 ₽</b><button id="pay" class="pay" disabled>Подтвердить оплату наличными</button></div>
</div>
<script>
const tg=Telegram.WebApp;tg.ready();const products={{products|tojson}},itemsEl=document.getElementById('items'),selectedEl=document.getElementById('selected'),cart=new Map();
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setQty(id,value){const p=products.find(x=>x.id===id),q=Math.max(0,Math.min(p.stock,Number(value)||0));if(q)cart.set(id,q);else cart.delete(id);draw()}
function draw(){let total=0,selected=[];itemsEl.innerHTML=products.map(p=>{const q=cart.get(p.id)||0;total+=q*p.price_kopecks;if(q)selected.push(`${esc(p.name)} × ${q}`);return `<div class="item"><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.category)} · ${(p.price_kopecks/100).toFixed(2)} ₽ · остаток ${p.stock}</span></div><div class="qty"><button data-minus="${p.id}" ${q?'':'disabled'}>−</button><input value="${q}" min="0" max="${p.stock}" data-input="${p.id}"><button data-plus="${p.id}" ${q>=p.stock?'disabled':''}>+</button></div></div>`}).join('')||'<span class="muted">Активных товаров нет.</span>';selectedEl.innerHTML=selected.length?'<b>В корзине:</b> '+selected.join(', '):'';document.getElementById('total').textContent='Итого: '+(total/100).toFixed(2)+' ₽';document.getElementById('pay').disabled=total<=0;itemsEl.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>setQty(Number(b.dataset.plus),(cart.get(Number(b.dataset.plus))||0)+1));itemsEl.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>setQty(Number(b.dataset.minus),(cart.get(Number(b.dataset.minus))||0)-1));itemsEl.querySelectorAll('[data-input]').forEach(x=>x.onchange=()=>setQty(Number(x.dataset.input),x.value))}
document.getElementById('pay').onclick=async()=>{const b=document.getElementById('pay');b.disabled=true;const r=await fetch('/webapp/admin-product-sale',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:{{club_id}},items:[...cart].map(([product_id,quantity])=>({product_id,quantity}))})}),d=await r.json();if(!r.ok){alert(d.detail||'Ошибка продажи');b.disabled=false;return}alert('Продажа оформлена на '+(d.total_kopecks/100).toFixed(2)+' ₽');location.reload()};draw();
</script></body></html>
