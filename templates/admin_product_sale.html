<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090909;color:#f7f7f7;padding:14px}.wrap{max-width:700px;margin:auto}.card{background:#151515;border:1px solid #2d2d2d;border-radius:16px;padding:14px;margin:10px 0}.item{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;border-top:1px solid #333;padding:12px 0}.muted{color:#aaa;font-size:13px}input,button{box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #444;background:#101010;color:#fff;font-size:15px}input{width:90px}button{width:100%;background:#fff;color:#090909;font-weight:700;cursor:pointer}h1,h2,b{color:#fff}</style>
<div class="wrap"><div class="card"><h2>Продажа товаров</h2><div class="muted">Соберите заказ и подтвердите оплату наличными. Остатки спишутся сразу.</div></div><div class="card"><div id="items"></div></div><div class="card"><b id="total">Итого: 0 ₽</b><button id="pay" disabled>Подтвердить оплату наличными</button></div></div>
<script>const tg=Telegram.WebApp;tg.ready();const products={{products|tojson}},itemsEl=document.getElementById('items'),cart=new Map();const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){let total=0;itemsEl.innerHTML=products.map(p=>{const q=cart.get(p.id)||0;total+=q*p.price_kopecks;return `<div class="item"><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.category)} · ${(p.price_kopecks/100).toFixed(2)} ₽ · остаток ${p.stock}</span></div><input type="number" min="0" max="${p.stock}" value="${q}" data-id="${p.id}"></div>`}).join('')||'<span class="muted">Активных товаров нет.</span>';document.getElementById('total').textContent='Итого: '+(total/100).toFixed(2)+' ₽';document.getElementById('pay').disabled=total<=0;itemsEl.querySelectorAll('input').forEach(x=>x.onchange=()=>{const q=Math.max(0,Math.min(Number(x.max),Number(x.value)||0));x.value=q;if(q)cart.set(Number(x.dataset.id),q);else cart.delete(Number(x.dataset.id));draw()})}document.getElementById('pay').onclick=async()=>{const b=document.getElementById('pay');b.disabled=true;const r=await fetch('/webapp/admin-product-sale',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:{{club_id}},items:[...cart].map(([product_id,quantity])=>({product_id,quantity}))})}),d=await r.json();if(!r.ok){alert(d.detail||'Ошибка продажи');b.disabled=false;return}alert('Продажа оформлена на '+(d.total_kopecks/100).toFixed(2)+' ₽');location.reload()};draw();</script></html>
