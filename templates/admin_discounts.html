<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Скидки</title><script src="https://telegram.org/js/telegram-web-app.js"></script>{% include "_staff_back_button.html" %}<style>body{font-family:sans-serif;background:#090909;color:#fff;padding:14px}.wrap{max-width:900px;margin:auto}.card{background:#151515;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}input,select,textarea,button{box-sizing:border-box;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #555;background:#111;color:#fff;width:100%}button{background:#fff;color:#111;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.client{border-top:1px solid #333;padding:10px 0;display:grid;grid-template-columns:1fr 120px;gap:8px}.muted{color:#aaa;font-size:13px}.danger{background:#511d1d;color:#fff}</style><div class="wrap"><div class="card"><h2>Скидки клуба</h2><div class="grid"><input id="name" placeholder="Название"><select id="kind"><option value="percent">Процент</option><option value="fixed">Фиксированная сумма</option></select><input id="value" type="number" min="0.01" step="0.01" placeholder="Значение"><select id="scope"><option value="subscriptions">Только абонементы</option><option value="products">Только товары</option><option value="all">Всё</option></select><input id="starts" type="date"><input id="ends" type="date"></div><textarea id="comment" placeholder="Комментарий"></textarea><button id="add">Создать</button></div><div class="card"><h3>Скидки</h3>{% for d in discounts %}<div><b>{{d.name}}</b> · {{(d.value / 100) if d.kind == 'fixed' else d.value}}{%if d.kind=='percent'%}%{%else%} ₽{%endif%} · {{d.scope}} <button data-del="{{d.id}}">Удалить</button></div>{%else%}<p class="muted">Нет скидок</p>{%endfor%}</div><div class="card"><h3>Привязать к профилю или студенту</h3><select id="discount">{%for d in discounts%}<option value="{{d.id}}">{{d.name}}</option>{%endfor%}</select><input id="query" placeholder="Имя, фамилия или номер"><button id="search">Найти</button><div id="clients"></div></div></div><script>const tg=Telegram.WebApp;tg.ready();const cid={{club_id}};async function change(action,index,discount,user_id=null,student_id=null){const r=await fetch('/webapp/admin-discounts/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:cid,action,index,user_id,student_id,discount})});const x=await r.json();if(!r.ok)return alert(x.detail||'Ошибка');location.reload()}add.onclick=()=>change('add',null,{name:name.value,kind:kind.value,value:value.value,scope:scope.value,starts_at:starts.value,ends_at:ends.value,comment:comment.value});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить?'))change('delete',Number(b.dataset.del))});search.onclick=async()=>{const r=await fetch(`/webapp/admin-discounts/clients?club_id=${cid}&q=${encodeURIComponent(query.value)}&init_data=${encodeURIComponent(tg.initData)}`),d=await r.json();clients.innerHTML=(d.clients||[]).map(c=>`<div class="client"><div><b>${c.name}</b><br><span class="muted">${c.phone||'номер не указан'} · ${c.orphan_student?'студент без профиля':'профиль'} · ${(c.students||[]).join(', ')}</span></div><button onclick="change('assign',Number(discount.value),null,${c.user_id||'null'},${c.student_id||'null'})">Привязать</button></div>`).join('')||'<p class="muted">Ничего не найдено</p>'};</script></html>
