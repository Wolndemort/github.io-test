<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Скидки</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:sans-serif;background:#090909;color:#fff;padding:14px}.wrap{max-width:900px;margin:auto}.card{background:#151515;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}input,select,textarea,button{box-sizing:border-box;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #555;background:#111;color:#fff;width:100%}button{background:#fff;color:#111;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.client{border-top:1px solid #333;padding:10px 0;display:grid;grid-template-columns:1fr 120px;gap:8px}.muted{color:#aaa;font-size:13px}.danger{background:#511d1d;color:#fff}</style><div class="wrap"><div class="card"><h2>Скидки клуба</h2><div class="grid"><input id="discountName" placeholder="Название"><select id="discountKind"><option value="percent">Процент</option><option value="fixed">Фиксированная сумма</option></select><input id="discountValue" type="number" min="0.01" step="0.01" placeholder="Значение"><select id="discountScope"><option value="subscriptions">Только абонементы</option><option value="products">Только товары</option><option value="all">Всё</option></select><input id="discountStarts" type="date"><input id="discountEnds" type="date"></div><textarea id="discountComment" placeholder="Комментарий"></textarea><button id="addDiscount">Создать</button></div><div class="card"><h3>Скидки</h3>{% for d in discounts %}<div><b>{{d.name}}</b> · {{(d.value / 100) if d.kind == 'fixed' else d.value}}{%if d.kind=='percent'%}%{%else%} ₽{%endif%} · {{d.scope}} <button data-del="{{d.id}}">Удалить</button></div>{%else%}<p class="muted">Нет скидок</p>{%endfor%}</div><div class="card"><h3>Привязать скидку</h3><select id="assignmentDiscount">{%for d in discounts%}<option value="{{d.id}}">{{d.name}}</option>{%endfor%}</select><input id="clientQuery" placeholder="Имя, фамилия или номер"><button id="searchClients">Найти</button><div id="clients"></div></div></div><script>const tg=Telegram.WebApp;tg.ready();const cid={{club_id}};async function change(action,index,discount,user_id=null,student_id=null){const r=await fetch('/webapp/admin-discounts/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,club_id:cid,action,index,user_id,student_id,discount})});const x=await r.json();if(!r.ok)return alert(x.detail||'Ошибка');location.reload()}document.getElementById('addDiscount').onclick=()=>change('add',null,{name:document.getElementById('discountName').value,kind:document.getElementById('discountKind').value,value:document.getElementById('discountValue').value,scope:document.getElementById('discountScope').value,starts_at:document.getElementById('discountStarts').value,ends_at:document.getElementById('discountEnds').value,comment:document.getElementById('discountComment').value});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить?'))change('delete',Number(b.dataset.del))});document.getElementById('searchClients').onclick=async()=>{const q=document.getElementById('clientQuery').value;const r=await fetch(`/webapp/admin-discounts/clients?club_id=${cid}&q=${encodeURIComponent(q)}&init_data=${encodeURIComponent(tg.initData)}`),d=await r.json();document.getElementById('clients').innerHTML=(d.clients||[]).map(c=>`<div class="client"><div><b>${c.name}</b><br><span class="muted">${c.phone||'номер не указан'} · ${c.orphan_student?'студент без профиля':'профиль'} · ${(c.students||[]).join(', ')}</span></div><button onclick="change('assign',Number(document.getElementById('assignmentDiscount').value),null,${c.user_id||'null'},${c.student_id||'null'})">Привязать</button></div>`).join('')||'<p class="muted">Ничего не найдено</p>'};</script></html>
