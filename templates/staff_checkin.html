<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font:16px sans-serif;padding:18px;max-width:600px;margin:auto}input,button{padding:12px;margin:5px 0;width:100%;box-sizing:border-box}.student{border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}.actions{display:flex;gap:8px}.actions button{width:50%}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:white;border-radius:18px;padding:24px;max-width:420px;width:100%;text-align:center}.ok{color:#16803c}.again{color:#9a6700}</style></head>
<body><h2>Отметить посещение</h2><p>Поиск по имени, фамилии или телефону</p><input id="search" placeholder="Иванов или 9991234567" autofocus><div id="list"></div><p id="status"></p><div id="modal" class="modal"><div class="box"><h2 id="modalTitle"></h2><p id="modalText"></p><button onclick="closeModal()">Понятно</button></div></div>
<script>const tg=window.Telegram.WebApp;tg.ready();const init=tg.initData,clubId={{club_id}},list=document.getElementById('list'),status=document.getElementById('status');let timer;function showAlert(title,text,again){modal.classList.add('show');modalTitle.textContent=title;modalTitle.className=again?'again':'ok';modalText.textContent=text}function closeModal(){modal.classList.remove('show')}async function search(){let q=document.getElementById('search').value,r=await fetch(`/webapp/staff-checkin/search?club_id=${clubId}&q=${encodeURIComponent(q)}&init_data=${encodeURIComponent(init)}`);if(!r.ok)return status.textContent='Нет доступа';let a=await r.json();list.innerHTML=a.map(s=>`<div class="student"><b>${s.name}</b><br><small>${s.phone||''} · ${s.active?'абонемент активен':'абонемент неактивен'}</small><div class="actions"><button onclick="check(${s.id},false)">Без турникета</button><button onclick="check(${s.id},true)">С турникетом</button></div></div>`).join('')||'<p>Ничего не найдено</p>'}async function check(id,open){status.textContent='Сохраняем...';let r=await fetch('/webapp/staff-checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({club_id:clubId,student_id:id,open_turnstile:open,init_data:init})}),d=await r.json();if(r.ok){let title=d.already_marked?'Посещение уже отмечено':'Посещение успешно отмечено';let mode=open?'С турникетом. ':'Без турникета. ';showAlert(title,mode+(d.message||'Сессия активна'),!!d.already_marked)}else{showAlert('Не удалось отметить',d.detail||'Ошибка сохранения',true)}}document.getElementById('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(search,250)};search();</script></body></html>
