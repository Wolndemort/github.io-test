<!doctype html>
{% if not turnstile_enabled %}<style>.actions button[onclick*="true"]{display:none}</style>{% endif %}
{% include "_staff_back_button.html" %}
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>function showAlert(title,text,again){document.getElementById('modal').classList.add('show');document.getElementById('modalTitle').textContent=title;document.getElementById('modalTitle').className=again?'again':'ok';document.getElementById('modalText').textContent=text}function closeModal(){document.getElementById('modal').classList.remove('show')}</script>
  <script defer src="/static/web/advance-checkin.js?v=2"></script>
  <style>
    body{font:16px sans-serif;padding:18px;max-width:600px;margin:auto}
    input,button{padding:12px;margin:5px 0;width:100%;box-sizing:border-box}
    .student{border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}
    .student-meta{margin:7px 0;color:#555;font-size:14px}
    .actions{display:flex;gap:8px}.actions button{width:50%}
    .modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}
    .modal.show{display:flex}.box{background:white;border-radius:18px;padding:24px;max-width:420px;width:100%;text-align:center}
    .ok{color:#16803c}.again{color:#9a6700}
  </style>
</head>
<body>
  <h2>Отметить посещение</h2>
  <p>Поиск по имени, фамилии или телефону</p>
  <input id="search" placeholder="Иванов или 9991234567" autofocus>
  <div id="list"></div><p id="status"></p>
  <div id="modal" class="modal"><div class="box"><h2 id="modalTitle"></h2><p id="modalText"></p><button onclick="closeModal()">Понятно</button></div></div>
</body>
</html>
