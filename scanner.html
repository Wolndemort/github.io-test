<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>QR Scanner</title>
    <!-- ИСПРАВЛЕНО: Полные пути к библиотекам -->
    <script src="https://telegram.org"></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        body { background: #1c1c1c; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border-radius: 15px; overflow: hidden; background: #000; }
        #status { font-size: 18px; color: #aaa; }
    </style>
</head>
<body>
    <h3>СКАНИРОВАНИЕ ПРОПУСКА</h3>
    <div id="reader"></div>
    <p id="status">Наведите камеру на QR-код</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        function onScanSuccess(decodedText) {
            // Отправляем данные боту и закрываем окно
            tg.sendData(decodedText); 
            tg.close(); 
        }

        function onScanFailure(error) {
            // Ошибки сканирования (фокус и т.д.) просто игнорируем
        }

        // Инициализация сканера
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: {width: 250, height: 250},
                videoConstraints: { facingMode: "environment" } // Принудительно задняя камера
            }
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
