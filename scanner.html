<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>QR Scanner</title>
    <!-- ИСПРАВЛЕНО: Полные пути к библиотекам -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body { background: #1c1c1c; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; border-radius: 15px; overflow: hidden; background: #000; }
    </style>
</head>
<body>
    <h3>СКАНИРОВАНИЕ ПРОПУСКА</h3>
    <div id="reader"></div>
    <p id="status">Наведите камеру на QR-код</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function onScanSuccess(decodedText) {
            tg.sendData(decodedText);
            setTimeout(() => { tg.close(); }, 100);
        }

        // Конфигурация для мгновенного запуска
        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        // Запуск камеры (environment - задняя камера)
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                document.getElementById('status').innerText = "Ошибка камеры: " + err;
            });
    </script>
</body>
</html>
