name: My_crm_bot

on:
  push:
    branches: [ master ]

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run test
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          DB_PASSWORD: fake_password
          SECRET_KEY: SECRET_KEY
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
           pip install aiosqlite
          pytest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/my_crm_bot
            mkdir -p backups
            docker exec gym_db pg_dump -U postgres crm_db > backups/pre_deploy_$(date +%F_%H-%M).sql
            ls -t backups/pre_deploy_*.sql | tail -n +11 | xargs rm -f -- 2>/dev/null || true
            git pull origin master
            pip install -r requirements.txt
            docker compose up -d --build
            docker image prune -f

      - name: Send Telegram Notification on Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ ОШИБКА CI/CD в проекте ${{ github.repository }}!
            
            Тип события: ${{ github.event_name }}
            Ветка: ${{ github.ref }}
            Коммит: ${{ github.sha }}
            
            Бро, тесты упали или деплой не прошел. Чекни логи: 
            https://github.com{{ github.repository }}/actions
            
