version: '3.8'

services:
  db:
    image: postgres:15-alpine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d crm_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: gym_db
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_USER: postgres
      - POSTGRES_PASSWORD: ${DB_PASSWORD}
      - POSTGRES_DB: crm_db
    volumes:
      - pg_data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: gym_bot
    restart: always

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && python handlers/start.py"
    env_file:
      - .env
    environment:
      - REDIS_URL: redis://redis:6379/0
      - DB_FILE: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/crm_db
      - PYTHON=/app
    volumes:
      - .:/app
      - ./logs:/app/logs

  gym-api:
    build: .
    container_name: gym_crm_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_FILE: "postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/crm_db"
    ports:
      - "8000:8000"
    volumes:
      - .:/app


  redis:
     image: redis:7-alpine
     restart: always
     ports:
       - "6379:6379"


volumes:
  pg_data:
