services:
  db:
    image: postgres:15-alpine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d crm_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: gym_db
    networks:
      - web_network
    ports:
      - "5433:5432"
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=crm_db
    volumes:
      - pg_data:/var/lib/postgresql/data

  gym-api:
    build: .
    container_name: gym_crm_api
    networks:
      - web_network
    restart: always
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_FILE=postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/crm_db
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./logs:/app/logs
    extra_hosts:
      - "securepay.tinkoff.ru:91.194.226.17"

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - web_network
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: gym_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web_network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - gym-api

  certbot:
    image: certbot/certbot
    container_name: gym_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

  go2rtc:
    image: alexxit/go2rtc
    container_name: gym_go2rtc
    restart: always
    networks:
      - web_network
    ports:
      - "1984:1984"
      - "8554:8554"

volumes:
  pg_data:

networks:
  web_network:
    name: web_network
    external: true

