events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Редирект со стандартного HTTP (порт 80) на HTTPS
    server {
        listen 80;
        server_name speedycrm.ru *.speedycrm.ru;
        return 301 https://$host$request_uri;
    }

    # Полноценный защищенный HTTPS сервер
    server {
        listen 443 ssl;
        server_name speedycrm.ru *.speedycrm.ru;

        # Пути к твоим сгенерированным SSL-сертификатам Wildcard
        ssl_certificate /etc/letsencrypt/live/speedycrm.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/speedycrm.ru/privkey.pem;

        # Перенаправляем абсолютно ВСЕ запросы (и страницы, и вебхуки) в FastAPI монолит
        location / {
            proxy_pass http://gym-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
