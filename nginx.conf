events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Редирект со стандартного HTTP (порт 80) на HTTPS
    server {
        listen 80;
        server_name speedycrm.ru *.speedycrm.ru;
        return 301 https://$host$request_uri;
    }

    # Полноценный защищенный HTTPS сервер
    server {
        listen 443 ssl;
        server_name speedycrm.ru *.speedycrm.ru;

        # Пути к твоим сгенерированным SSL-сертификатам Wildcard
        ssl_certificate /etc/letsencrypt/live/speedycrm.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/speedycrm.ru/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

        # Для живого видео отключаем буфер. Иначе Nginx может сначала копить
        # несколько кадров и только потом отправлять их в Telegram WebView.
        location = /webapp/live_cam/stream {
            proxy_pass http://gym-api:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            send_timeout 1h;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Остальные страницы и вебхуки отправляем в FastAPI монолит
        location / {
            proxy_pass http://gym-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
